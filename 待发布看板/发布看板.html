季食材吃对。润燥糖水、四神汤、当季根菜，三样都不贵不麻烦，厨房就能做。你家里秋天常炖哪一道？评论区告诉我，我去抄作业。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#立秋顺时食养 #润燥养肺 #顺时养生 #食养食方 #节气食单 #食疗食养 #厨房养生 #秋日食养 #滋阴润肺 #立秋润燥\n\n✦ ✦ ✦\n\n💡 免责声明：本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。\n\n---\n配图说明（动态生成：方法数 N=3 → 共 4 张 = 1 封面 + 3 方法图）：\n- cover_3x4.png：封面，关键词 节气食单|顺时养生|老祖宗\n- body_1.png：对应正文方法一，关键词 立秋润燥糖水|银耳雪梨\n- body_2.png：对应正文方法二，关键词 四神汤|健脾\n- body_3.png：对应正文方法三，关键词 当季根菜|山药\n---\n"}, {"id": "2026-08-11_久坐8小时4个小动作把身体救回来", "account": "白领阿白自救记", "title": "久坐8小时4个小动作把身体救回来", "category": "", "date": "2026-08-11", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-11 18:28", "publishedAt": null, "summary": "久坐8小时？4个小动作把身体救回来 💼 昨天连续坐了快9个小时改方案，下班站起来那一瞬间，腰像断了一", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E4%B9%85%E5%9D%908%E5%B0%8F%E6%97%B64%E4%B8%AA%E5%B0%8F%E5%8A%A8%E4%BD%9C%E6%8A%8A%E8%BA%AB%E4%BD%93%E6%95%91%E5%9B%9E%E6%9D%A5/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E4%B9%85%E5%9D%908%E5%B0%8F%E6%97%B64%E4%B8%AA%E5%B0%8F%E5%8A%A8%E4%BD%9C%E6%8A%8A%E8%BA%AB%E4%BD%93%E6%95%91%E5%9B%9E%E6%9D%A5/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E4%B9%85%E5%9D%908%E5%B0%8F%E6%97%B64%E4%B8%AA%E5%B0%8F%E5%8A%A8%E4%BD%9C%E6%8A%8A%E8%BA%AB%E4%BD%93%E6%95%91%E5%9B%9E%E6%9D%A5/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E4%B9%85%E5%9D%908%E5%B0%8F%E6%97%B64%E4%B8%AA%E5%B0%8F%E5%8A%A8%E4%BD%9C%E6%8A%8A%E8%BA%AB%E4%BD%93%E6%95%91%E5%9B%9E%E6%9D%A5/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E4%B9%85%E5%9D%908%E5%B0%8F%E6%97%B64%E4%B8%AA%E5%B0%8F%E5%8A%A8%E4%BD%9C%E6%8A%8A%E8%BA%AB%E4%BD%93%E6%95%91%E5%9B%9E%E6%9D%A5/cover_3x4.png"], "text": "久坐8小时？4个小动作把身体救回来\n\n💼 昨天连续坐了快9个小时改方案，下班站起来那一瞬间，腰像断了一样、腿还发麻。作为在工位上自救快一年的打工人，我太懂这种\"坐得住人、站不起腰\"的崩溃了。今天不灌鸡汤，直接给你4个我每天带薪就能做的动作，不占地、不用器械，工位上就能练。\n\n📌 方法一：【收下巴·把\"电脑脖\"推回去】坐直，食指抵住下巴，水平向后轻推（不是低头），感受到后颈被拉长就停，慢慢回正，10次为1组，每小时1组。我刚坐班那会儿头往前探得像乌龟，坚持两周，同事说我\"背挺直了\"。注意：推的时候别仰头，脖子前后一条线才对，头晕就停下。\n\n📌 方法二：【坐姿猫牛式·救僵掉的腰】坐直，双手放膝盖，吸气挺胸塌腰抬头（牛式），呼气含胸弓背低头（猫式），慢做8次为1组，每天3组。这招专治久坐腰硬，我下午三点必做，做完腰椎\"咔\"一声松快。注意：幅度以不疼为准，腰椎间盘突出的人减小幅度、别猛甩。\n\n📌 方法三：【勾脚踝泵·救发胀的腿】坐直，双脚离地，用力勾脚尖（脚尖朝自己）停2秒，再绷脚尖（脚尖下压）停2秒，左右交替或双脚同做，20次为1组，每天3组。这动作帮血液从腿部往回泵，我久坐腿肿的时候做，下班脚踝不再勒出印子。注意：膝盖有伤就减小幅度，做完记得站起来走两步。\n\n📌 方法四：【扩胸沉肩·救圆肩含胸】坐直，双臂屈肘抬到与肩平、双手握拳在胸前，用力向两侧后方扩胸并下沉肩膀（别耸肩），停3秒回正，10次为1组，每小时1组。这招打开被键盘锁死的胸肩，我午休做一组，下午打字肩膀不再耸着。注意：扩的时候别憋气，肩胛骨有拉伸感就够，别硬掰。\n\n💪 身体不是一天坐坏的，也别指望一天好。但这4个动作加起来真就几分钟，开会空隙、等水间隙都能练，不用器械不用场地。从今天起，每小时站起来推一次下巴、扩一次胸，下班你会发现腰还是自己的。你工位上最常做啥缓解？评论区交出来，我去抄作业。\n\n🏷️ 话题标签：\n#久坐自救 #办公室养生 #打工人续命 #带薪养生 #颈椎保养 #腰椎自救 #碎片化运动 #8小时久坐 #健康打卡 #工位拉伸\n#办公室微运动 #全民健身日 #打工人碎片化续命 #脆皮打工人带薪养生\n\n💡 免责声明：\n本文为办公室养生与久坐自救分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有严重身体不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-11_像老年人一样活着我体检变好", "account": "白领阿白自救记", "title": "像老年人一样活着我体检变好", "category": "", "date": "2026-08-11", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-11 20:00", "publishedAt": null, "summary": "打工人学老人5个习惯，体检悄悄变好 💼 去年体检查出好几项指标飘红，29岁的我看着报告像看成绩单。今", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%83%8F%E8%80%81%E5%B9%B4%E4%BA%BA%E4%B8%80%E6%A0%B7%E6%B4%BB%E7%9D%80%E6%88%91%E4%BD%93%E6%A3%80%E5%8F%98%E5%A5%BD/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%83%8F%E8%80%81%E5%B9%B4%E4%BA%BA%E4%B8%80%E6%A0%B7%E6%B4%BB%E7%9D%80%E6%88%91%E4%BD%93%E6%A3%80%E5%8F%98%E5%A5%BD/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%83%8F%E8%80%81%E5%B9%B4%E4%BA%BA%E4%B8%80%E6%A0%B7%E6%B4%BB%E7%9D%80%E6%88%91%E4%BD%93%E6%A3%80%E5%8F%98%E5%A5%BD/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%83%8F%E8%80%81%E5%B9%B4%E4%BA%BA%E4%B8%80%E6%A0%B7%E6%B4%BB%E7%9D%80%E6%88%91%E4%BD%93%E6%A3%80%E5%8F%98%E5%A5%BD/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%83%8F%E8%80%81%E5%B9%B4%E4%BA%BA%E4%B8%80%E6%A0%B7%E6%B4%BB%E7%9D%80%E6%88%91%E4%BD%93%E6%A3%80%E5%8F%98%E5%A5%BD/body_5.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%83%8F%E8%80%81%E5%B9%B4%E4%BA%BA%E4%B8%80%E6%A0%B7%E6%B4%BB%E7%9D%80%E6%88%91%E4%BD%93%E6%A3%80%E5%8F%98%E5%A5%BD/cover_3x4.png"], "text": "打工人学老人5个习惯，体检悄悄变好\n\n💼 去年体检查出好几项指标飘红，29岁的我看着报告像看成绩单。今年复查，几个箭头悄悄回去了。我没吃保健品、没办健身卡，就是把日子过成了我妈那辈的节奏——早睡、按时吃、慢下来。今天把这套\"老年作息\"拆成5个习惯，打工人照着抄就管用。\n\n💡 方法一：【把觉睡够】晚上10:30关灯，早上6:30起，雷打不动。以前我熬到1点刷手机，白天靠咖啡续命，黑眼圈挂到下巴。改满一个月，入睡从躺下1小时缩到20分钟，早起也不头痛了。注意：别周末报复性补觉到中午，生物钟一乱前功尽弃。\n\n🌿 方法二：【饭点卡死】早8点、午12点、晚6点准时吃，晚8点后不进食。我以前午饭拖到2点、半夜还吃宵夜，胃总反酸。固定饭点后胃酸规律了，下午不再饿到心慌手抖。注意：晚饭七分饱，睡前三小时吃完，否则躺下胃里翻江倒海。\n\n✨ 方法三：【饭后溜达】每顿饭后靠墙站或慢走20分钟，不立刻躺平刷剧。坚持两周，饭后犯困、肚子胀少了，腰腹也紧实一点。注意：别饭后剧烈运动，慢走就行，胃下垂的人更别跑跳。\n\n📌 方法四：【手机断舍离】晚9点后把手机放客厅充电，床头只留纸质书。我原是睡前短视频停不下来的人，改了之后大脑不亢奋，沾枕就困。注意：别把手机带上床，蓝光和算法比咖啡更让人清醒。\n\n💪 方法五：【心态佛系】不卷无效加班，下班切到\"退休模式\"，养盆花、散个步。以前一点小事就焦虑到失眠，现在学会\"差不多就行\"。注意：佛系不是摆烂，是把精力留给真正重要的事，情绪稳了身体才稳。\n\n🌸 这5个习惯没一个要花钱，难的只有\"坚持\"二字。我把节奏调慢以后，体检单上的箭头少了，白天精神也足了。你最近一次体检怎么样？评论区聊聊，一起当个快乐的\"年轻老年人\"。\n\n🏷️ 话题标签：\n#打工人养生 #反向养生 #办公室养生 #早睡早起 #慢生活 #健康体检 #打工人的老年生活 #八段锦 #打工人工位养生 #退休预演 #办公室养生茶 #久坐肩颈自救\n\n💡 免责声明：\n本文为办公室养生与久坐自救分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有严重身体不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-11_压力肥真相不是你懒是激素在搞事", "account": "小白情绪养生局", "title": "压力肥真相不是你懒是激素在搞事", "category": "", "date": "2026-08-11", "status": "待发布", "recommended_time": "—", "best_window": "（睡前情绪共鸣时段）", "recommendedTime": "", "compliance": "—", "publish_time": "", "createdAt": "2026-08-11 23:04", "publishedAt": null, "summary": "压力肥真相：不是你懒，是激素在搞事 ✦ ✦ ✦ 💛 去年有段时间，我没多吃也没偷懒，体重却悄悄涨了快", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%8E%8B%E5%8A%9B%E8%82%A5%E7%9C%9F%E7%9B%B8%E4%B8%8D%E6%98%AF%E4%BD%A0%E6%87%92%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E6%90%9E%E4%BA%8B/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%8E%8B%E5%8A%9B%E8%82%A5%E7%9C%9F%E7%9B%B8%E4%B8%8D%E6%98%AF%E4%BD%A0%E6%87%92%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E6%90%9E%E4%BA%8B/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%8E%8B%E5%8A%9B%E8%82%A5%E7%9C%9F%E7%9B%B8%E4%B8%8D%E6%98%AF%E4%BD%A0%E6%87%92%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E6%90%9E%E4%BA%8B/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%8E%8B%E5%8A%9B%E8%82%A5%E7%9C%9F%E7%9B%B8%E4%B8%8D%E6%98%AF%E4%BD%A0%E6%87%92%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E6%90%9E%E4%BA%8B/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%8E%8B%E5%8A%9B%E8%82%A5%E7%9C%9F%E7%9B%B8%E4%B8%8D%E6%98%AF%E4%BD%A0%E6%87%92%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E6%90%9E%E4%BA%8B/cover_3x4.png"], "text": "压力肥真相：不是你懒，是激素在搞事\n\n✦ ✦ ✦\n\n💛 去年有段时间，我没多吃也没偷懒，体重却悄悄涨了快5斤，腰腹一圈肉越减越顽固，裤子都紧了一扣。后来我才懂：这不是懒，是压力激素皮质醇在搞事。压力大时它升高，身体会自动囤脂肪、尤其爱往肚子堆，还让你特别想吃甜的。今天用闺蜜的口气，聊聊我是怎么把这块“压力肉”慢慢松下来的。\n\n✦ ✦ ✦\n\n🌿 方法一：【把觉睡够】皮质醇最爱在熬夜时乱飙，凌晨一两点是它最不听话的时候。我给自己定死规矩：23点前关灯，手机丢客厅充电，睡前喝半杯温水、拉好窗帘。坚持两周，腰围松了差不多2厘米，白天对甜食的渴望也淡了。别信“熬夜刷剧放松”，越晚越想吃夜宵，反而越减越肥。\n\n✦ ✦ ✦\n\n✨ 方法二：【饭后别瘫着】以前一吃完就躺平刷手机，现在逼自己饭后慢走20分钟，不快走、溜达就行，绕着小区或楼道走，每天凑够6000步。这样帮身体平稳血糖，皮质醇跟着降，小肚子没那么胀了，下午也不容易犯困。注意是慢走，别一吃完就剧烈运动，反而伤胃。\n\n✦ ✦ ✦\n\n📌 方法三：【睡前戒信息】睡前一小时我关掉工作群和新闻推送，改做5分钟深呼吸：鼻子慢慢吸气4秒，憋住，嘴巴轻呼7秒，重复5组。亲测心跳真的会慢下来，入睡快了半小时。很多人以为“刷手机放松”，其实短视频和焦虑消息，才是最催肥的东西。\n\n✦ ✦ ✦\n\n💪 方法四：【戒掉情绪奶茶】压力一大我就想来杯半糖奶茶，但高糖会推高胰岛素，脂肪更容易囤在肚子。现在下午改喝温水或玫瑰桑叶茶，想甜就泡两颗桂圆。一个月下来，那种“总想啃甜的”冲动明显淡了。误区是以为零糖可乐没事，代糖照样会刺激食欲。\n\n✦ ✦ ✦\n\n🌙 总结一下：压力肥真不是你懒，是激素在替你“存粮”。把觉睡够、饭后慢走、睡前戒信息、戒掉情绪奶茶，这四件小事我坚持了一个月，腰腹真的松了一圈。你最近也在被压力肥困扰吗？评论区说说你的困扰，咱们一起慢慢松下来。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#压力肥 #皮质醇 #情绪养生 #失眠自救 #睡前仪式 #不焦虑减肥 #打工人养生 #内分泌减肥 #压力管理\n\n✦ ✦ ✦\n\n💡 免责声明：本文为情绪陪伴与日常养生分享，不替代专业医疗诊断与治疗。如您有严重身心不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-11_常喝这3碗汤闺蜜以为我做焕肤", "account": "白哥的顺时食堂", "title": "常喝这3碗汤，闺蜜以为我偷偷做了焕肤", "category": "数字型+反差型", "date": "2026-08-11", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "PASSED", "publish_time": "", "createdAt": "2026-08-11 06:59", "publishedAt": null, "summary": "常喝这3碗汤，闺蜜以为我偷偷做了焕肤 ✦ ✦ ✦ 💛 上个月闺蜜突然盯着我脸问：\"你最近是不是去做了", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%B8%B8%E5%96%9D%E8%BF%993%E7%A2%97%E6%B1%A4%E9%97%BA%E8%9C%9C%E4%BB%A5%E4%B8%BA%E6%88%91%E5%81%9A%E7%84%95%E8%82%A4/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%B8%B8%E5%96%9D%E8%BF%993%E7%A2%97%E6%B1%A4%E9%97%BA%E8%9C%9C%E4%BB%A5%E4%B8%BA%E6%88%91%E5%81%9A%E7%84%95%E8%82%A4/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%B8%B8%E5%96%9D%E8%BF%993%E7%A2%97%E6%B1%A4%E9%97%BA%E8%9C%9C%E4%BB%A5%E4%B8%BA%E6%88%91%E5%81%9A%E7%84%95%E8%82%A4/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E5%B8%B8%E5%96%9D%E8%BF%993%E7%A2%97%E6%B1%A4%E9%97%BA%E8%9C%9C%E4%BB%A5%E4%B8%BA%E6%88%91%E5%81%9A%E7%84%95%E8%82%A4/cover_3x4.png"], "text": "---\n目标账号：@白哥的顺时食堂\n选题标题：常喝这3碗汤，闺蜜以为我偷偷做了焕肤\n分类角标：数字型+反差型\n增长任务：建立信任\n合规检查：PASSED\n热点标签来源：热点话题库/2026-08-10_热点报告.md（匹配：立秋润燥食养 / 节气药膳 / 顺时养生茶饮 / 暑湿食养）\n---\n\n常喝这3碗汤，闺蜜以为我偷偷做了焕肤\n\n✦ ✦ ✦\n\n💛 上个月闺蜜突然盯着我脸问：\"你最近是不是去做了焕肤？怎么亮了这么多。\"其实我啥也没动，只是把这一个月的奶茶换成了几碗家常汤水。入秋后燥气重，外抹不如内调，比起瓶瓶罐罐，我更信一口热汤的踏实；作为顺时食养的爱好者，我一直相信好气色是喝出来的，不是抹出来的。\n\n✦ ✦ ✦\n\n🌿 方法一：【红枣银耳莲子羹】取银耳 1 朵提前泡发、红枣 8 颗去核、莲子 15 颗，加 1.2 升清水小火慢炖 40 分钟，每周喝 3 次。我连续喝了 14 天，最明显的感受是早起脸不暗沉了，上妆也不卡粉，午后也不怎么犯困，皮肤状态稳了、没再爆干皮。注意：银耳要炖足 40 分钟出胶才有效，别图快开大火，糖也少放更清爽。\n\n✦ ✦ ✦\n\n✨ 方法二：【玫瑰花陈皮饮】干玫瑰花 6 朵、六年陈皮 3 克，用 80℃ 温水焖泡 10 分钟，饭后半小时喝。这杯主打理气活血，我经期前一周每天一杯，往年必爆的痘这次安稳多了，脸色也从蜡黄变透亮，连饭后胀气都轻了，朋友说我整个人透着光。注意：经期量大那几天先停，孕妇忌用。\n\n✦ ✦ ✦\n\n📌 方法三：【五红汤】红豆 30 克、红皮花生 20 克、红枣 5 颗、枸杞 10 克、少许红糖，泡 1 小时后炖 35 分钟，每周 2 次。坚持一个月，我手脚不再冰凉，嘴唇也有了血色；经期后连喝 5 天，气色回暖最快。记住气色是慢慢养回来的，别指望三天见效，红糖只是点缀别当主食糖。注意：湿热体质少放红糖，感冒发烧时别喝。\n\n✦ ✦ ✦\n\n💪 养颜真不用贵妇面霜堆出来——一碗羹、一杯饮、一锅汤，顺着节气慢慢喝，气色自己会回来。我现在每周固定轮换这 3 碗，比敷面膜实在也更省心。你平时最爱喝哪道汤？评论区告诉我，下期出合集。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：\n#内调养颜 #顺时养生 #喝出好气色 #食养日常 #女生必备汤水\n#立秋润燥食养 #节气药膳 #顺时养生茶饮 #暑湿食养\n\n✦ ✦ ✦\n\n💡 免责声明：\n本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。\n\n---\n配图说明（方法数 3 → 共 4 张；每张一一对应）：\n- cover_3x4.png：封面，关键词 养颜汤水｜闺蜜焕肤误会｜三碗汤\n- body_1.png：对应【方法一：红枣银耳莲子羹】，关键词 银耳羹｜红枣莲子｜炖出胶\n- body_2.png：对应【方法二：玫瑰花陈皮饮】，关键词 玫瑰花｜陈皮｜温水焖泡\n- body_3.png：对应【方法三：五红汤】，关键词 红豆花生｜红枣枸杞｜红润砂锅\n- 合计：4 张（封面 1 + 方法配图 3）\n---\n"}, {"id": "2026-08-11_成本3块的养肤汤湿气重必喝", "account": "白哥的顺时食堂", "title": "成本3块的养肤汤湿气重必喝", "category": "", "date": "2026-08-11", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-11 13:03", "publishedAt": null, "summary": "", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E6%88%90%E6%9C%AC3%E5%9D%97%E7%9A%84%E5%85%BB%E8%82%A4%E6%B1%A4%E6%B9%BF%E6%B0%94%E9%87%8D%E5%BF%85%E5%96%9D/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E6%88%90%E6%9C%AC3%E5%9D%97%E7%9A%84%E5%85%BB%E8%82%A4%E6%B1%A4%E6%B9%BF%E6%B0%94%E9%87%8D%E5%BF%85%E5%96%9D/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E6%88%90%E6%9C%AC3%E5%9D%97%E7%9A%84%E5%85%BB%E8%82%A4%E6%B1%A4%E6%B9%BF%E6%B0%94%E9%87%8D%E5%BF%85%E5%96%9D/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E6%88%90%E6%9C%AC3%E5%9D%97%E7%9A%84%E5%85%BB%E8%82%A4%E6%B1%A4%E6%B9%BF%E6%B0%94%E9%87%8D%E5%BF%85%E5%96%9D/cover_3x4.png"], "text": "---\n成本3块的养肤汤，湿气重必喝\n\n💛 一到夏天就脸肿、肤色暗黄、整个人像泡过水？别急着换贵妇精华，问题可能出在\"湿\"上。中医讲脾主运化，湿重的人营养吸收差，脸自然没光泽。很多人花几百块买祛湿产品，其实厨房里几味平平无奇的食材就够。作为顺时食养的爱好者，我越养生越觉得：好气色是喝出来的，不是抹出来的。今天分享3个成本只要3块左右的养肤汤方，把湿排了，脸自己会亮。\n\n✦ ✦ ✦\n\n📌 方法一：【四神汤平价版·茯苓山药莲子芡实】茯苓10克、山药干15克、莲子10克、芡实10克，冲洗后加1升清水小火炖40分钟，当天喝完，每周3次。这四味是健脾祛湿的经典底方，食材批发市场论斤卖，一顿摊下来不到3块。我坚持一个月，最明显的感觉是早起脸不浮肿了，上妆也不卡粉。芡实还能固肾，女生经期后连喝几天特别合适。注意：便秘严重的那几天先减量，感冒发烧别喝。\n\n✦ ✦ ✦\n\n📌 方法二：【赤小豆薏米茯苓水】赤小豆30克、炒薏米20克、茯苓10克，泡2小时后煮30分钟，只喝水不吃渣，每天1壶。重点：薏米一定要先炒过再煮，生薏米偏寒反而伤脾。这壶主打把体内多余的水湿从小便带走，我下午腿胀的时候喝，第二天脚踝明显不勒。煮完的赤小豆别扔，拌点蜂蜜当小食也不浪费。注意：孕期和经期量大时停喝，体质虚寒的人少放赤小豆。\n\n✦ ✦ ✦\n\n📌 方法三：【陈皮炒米茶】大米一小把干锅小火炒到微黄出香，加3克老陈皮冲沸水焖10分钟，当水喝，成本不到1块。这杯最便宜也最好坚持，炒米温脾、陈皮理气，喝完肚子暖暖的、排气也顺了。注意：陈皮选三年以上的更温和，胃酸多的人饭后喝别空腹。\n\n✦ ✦ ✦\n\n💪 养肤这事儿，贵的不一定对，顺的才长久。三碗汤换着喝，一周成本不到20块，比一瓶精华实在多了。你家里常备哪味祛湿食材？评论区告诉我，下期出合集。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：\n#湿气重 #健脾祛湿 #四神汤 #养肤内调 #平价养生 #顺时食养 #夏季养生 #低成本养肤\n\n✦ ✦ ✦\n\n💡 免责声明：\n本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。\n\n---\n"}, {"id": "2026-08-11_打工人沉默了每天5分钟肩颈不痛了", "account": "白领阿白自救记", "title": "打工人沉默了每天5分钟肩颈不痛了", "category": "", "date": "2026-08-11", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-11 12:42", "publishedAt": null, "summary": "", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E6%89%93%E5%B7%A5%E4%BA%BA%E6%B2%89%E9%BB%98%E4%BA%86%E6%AF%8F%E5%A4%A95%E5%88%86%E9%92%9F%E8%82%A9%E9%A2%88%E4%B8%8D%E7%97%9B%E4%BA%86/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E6%89%93%E5%B7%A5%E4%BA%BA%E6%B2%89%E9%BB%98%E4%BA%86%E6%AF%8F%E5%A4%A95%E5%88%86%E9%92%9F%E8%82%A9%E9%A2%88%E4%B8%8D%E7%97%9B%E4%BA%86/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E6%89%93%E5%B7%A5%E4%BA%BA%E6%B2%89%E9%BB%98%E4%BA%86%E6%AF%8F%E5%A4%A95%E5%88%86%E9%92%9F%E8%82%A9%E9%A2%88%E4%B8%8D%E7%97%9B%E4%BA%86/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E6%89%93%E5%B7%A5%E4%BA%BA%E6%B2%89%E9%BB%98%E4%BA%86%E6%AF%8F%E5%A4%A95%E5%88%86%E9%92%9F%E8%82%A9%E9%A2%88%E4%B8%8D%E7%97%9B%E4%BA%86/cover_3x4.png"], "text": "---\n打工人沉默了…每天5分钟，肩颈不痛了\n✦ ✦ ✦\n💼 上周开完两小时周会，同事揉着脖子来一句：\"你脖子怎么还能转？\"我这才发现，身边坐班的几乎人人僵着肩。我以前下班一按肩膀就疼，洗澡才敢慢慢转头。作为在工位上自救快一年的打工人，今天不灌鸡汤，直接给你3个我每天都在做的5分钟动作，开会前的空隙就能练，肩颈真的会松。\n✦ ✦ ✦\n📌 方法一：【收下巴·把\"电脑脖\"推回去】坐直，食指抵住下巴，水平向后轻推（不是低头），感受后颈被拉长就停，慢慢回正，10次为1组，每小时1组。我刚坐班那会儿头往前探得像乌龟，坚持两周，同事说我\"背挺直了\"。我现在设了整点闹钟，接水顺手就推一组，根本不占额外时间。注意：推的时候别仰头，脖子前后一条线才对，头晕就停下。\n✦ ✦ ✦\n📌 方法二：【靠墙天使·打开圆肩】后脑、肩、臀、脚跟贴墙，小臂贴墙、手肘弯90度，像天使扇翅膀那样沿墙上下滑动，8次为1组，每天3组。这招专治含胸，我午休靠墙做，下午打字肩膀不再耸着。刚开始手臂贴不住墙没关系，能滑多高算多高，重点是把胸廓拉开。注意：腰别离开墙去代偿，动作慢一点，肩膀酸是正常的，关节响就减小幅度。\n✦ ✦ ✦\n📌 方法三：【坐姿转体+颈侧拉伸】坐直，右手扶椅背、左手抱右膝向右转体保持15秒，换边；再单手过头向对侧轻拉脖子，每侧30秒。一套下来胸椎和斜方肌都放了。我下午三点必做，比喝咖啡提神，这一组尤其适合盯屏幕久了眼睛发酸的时候，顺带把肩也卸了。注意：转体靠呼气带动，别憋气，颈椎有增生的人颈侧拉伸力度减半。\n✦ ✦ ✦\n💪 肩颈不是一天僵的，也别指望一天好。但这三个动作加起来真就5分钟，带薪就能练，不用器械不用场地。我给自己定的规矩：接电话就站起来做，一天不知不觉五六组。从今天起，每小时推一次下巴、午休靠次墙、下午转个体，下班你会发现脖子还是自己的。你工位上最常做啥缓解？评论区交出来，我去抄作业。\n✦ ✦ ✦\n🏷️ 话题标签：#打工人自救 #肩颈放松 #办公室微运动 #久坐党 #带薪养生 #全民健身日\n✦ ✦ ✦\n⚠️ 免责声明：以上为个人久坐自救经验分享，非医疗建议、非物理治疗。如肩颈疼痛持续、伴手麻头晕，请及时就医，勿盲目跟练。\n---\n"}, {"id": "2026-08-11_肩颈硬成石板3个动作立刻松", "account": "白领阿白自救记", "title": "肩颈硬成石板3个动作立刻松", "category": "", "date": "2026-08-11", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-11 23:41", "publishedAt": null, "summary": "肩颈硬成石板？3个动作立刻松 ✦ ✦ ✦ 💛 昨天改方案改到11点，脖子僵得转不动，手按上去像块硬石", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E8%82%A9%E9%A2%88%E7%A1%AC%E6%88%90%E7%9F%B3%E6%9D%BF3%E4%B8%AA%E5%8A%A8%E4%BD%9C%E7%AB%8B%E5%88%BB%E6%9D%BE/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E8%82%A9%E9%A2%88%E7%A1%AC%E6%88%90%E7%9F%B3%E6%9D%BF3%E4%B8%AA%E5%8A%A8%E4%BD%9C%E7%AB%8B%E5%88%BB%E6%9D%BE/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E8%82%A9%E9%A2%88%E7%A1%AC%E6%88%90%E7%9F%B3%E6%9D%BF3%E4%B8%AA%E5%8A%A8%E4%BD%9C%E7%AB%8B%E5%88%BB%E6%9D%BE/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E8%82%A9%E9%A2%88%E7%A1%AC%E6%88%90%E7%9F%B3%E6%9D%BF3%E4%B8%AA%E5%8A%A8%E4%BD%9C%E7%AB%8B%E5%88%BB%E6%9D%BE/cover_3x4.png"], "text": "肩颈硬成石板？3个动作立刻松\n\n✦ ✦ ✦\n\n💛 昨天改方案改到11点，脖子僵得转不动，手按上去像块硬石板，连转头看后视镜都要整个人挪过去。我一度以为得去推拿店办张三千块的卡了。后来试了工位上就能做的3个小动作，每天就5分钟，坚持一周脖子真的松了不少，现在转头不再\"嘎吱\"响。分享给同样天天久坐、肩颈像背了块石板的你。\n\n✦ ✦ ✦\n\n🌿 方法一：【米字操】坐直，用头慢慢写\"米\"字，每个方向停留2秒，上下左右加4个斜角共8笔，一组约1分钟，连做3组。我刚开始写\"横\"那笔都卡顿发颤，第3天明显顺了，第7天能写完一整组不卡壳。误区提醒：动作要慢，靠颈部肌肉带动，千万别用甩的——我第一次图快甩了两下，当场头晕了半分钟，反而更紧。\n\n✦ ✦ ✦\n\n✨ 方法二：【扣手开肩】双手在背后十指交扣，慢慢往天花板方向抬，同时挺胸夹背，保持5秒、放松，重复5组。这个动作直接把含胸的肩膀拉开，我做第一组就能听见肩后\"咔\"地松一下，那种酸爽感特别解压。个人体验：连续做5天，穿内衣肩带勒出的红印子都比以前淡了。误区：别憋气，抬手时自然呼吸，越憋肩越紧，我闺蜜就因为憋气做到脸通红还没效果。\n\n✦ ✦ ✦\n\n📌 方法三：【收下巴】坐直、眼睛平视，用两根手指把下巴往后推（像做出双下巴），保持5秒、放松，重复10次。它专门纠正\"头往前伸\"的乌龟颈姿势，我把它绑在每小时喝水时做一轮，两周后同事说我坐姿挺拔了，连斜方肌的鼓包都小了一圈。注意：推的是下巴不是仰头，仰头反而把颈椎往反方向压，越做越难受。\n\n✦ ✦ ✦\n\n💪 三个动作都不用起身、不占地，开会间隙也能悄悄练。关键是\"每天5分钟\"比\"周末猛练1小时\"更管用——肌肉是细水长流松开的，不是一次拉到位。你肩颈最僵的是哪块？是后颈发硬还是肩膀耸着放松不下来？评论区说说，我帮你看看哪个动作最对症。\n\n✦ ✦ ✦\n\n🏷️ #久坐肩颈自救 #打工人工位养生 #八段锦反向养生 #办公室养生茶 #肩颈放松 #米字操 #含胸改善 #办公族养生 #打工人自救 #肩颈僵硬 #工位微运动 #颈椎保养\n\n✦ ✦ ✦\n\n💡 本文为办公室养生与久坐自救分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有严重身体不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-11_赶进度喝菊花枸杞护眼又降火", "account": "白哥的顺时食堂", "title": "赶进度喝菊花枸杞，护眼又降火", "category": "", "date": "2026-08-11", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-11 00:22", "publishedAt": null, "summary": "标题: 赶进度喝菊花枸杞，护眼又降火 💡 赶方案、盯屏幕、连轴转的日子里，眼干、嘴起皮、心里冒火几乎", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E8%B5%B6%E8%BF%9B%E5%BA%A6%E5%96%9D%E8%8F%8A%E8%8A%B1%E6%9E%B8%E6%9D%9E%E6%8A%A4%E7%9C%BC%E5%8F%88%E9%99%8D%E7%81%AB/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E8%B5%B6%E8%BF%9B%E5%BA%A6%E5%96%9D%E8%8F%8A%E8%8A%B1%E6%9E%B8%E6%9D%9E%E6%8A%A4%E7%9C%BC%E5%8F%88%E9%99%8D%E7%81%AB/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E8%B5%B6%E8%BF%9B%E5%BA%A6%E5%96%9D%E8%8F%8A%E8%8A%B1%E6%9E%B8%E6%9D%9E%E6%8A%A4%E7%9C%BC%E5%8F%88%E9%99%8D%E7%81%AB/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-11_%E8%B5%B6%E8%BF%9B%E5%BA%A6%E5%96%9D%E8%8F%8A%E8%8A%B1%E6%9E%B8%E6%9D%9E%E6%8A%A4%E7%9C%BC%E5%8F%88%E9%99%8D%E7%81%AB/cover_3x4.png"], "text": "---\n目标账号: 白哥的顺时食堂\n选题标题: 赶进度喝菊花枸杞，护眼又降火\n选题来源: 今日热点#9「顺时养生茶饮·对症泡一杯」推荐标题①\n推荐发布时间: 12:30（午间轻松刷到）\n配图数: 4（封面1+方法3）\n---\n\n标题: 赶进度喝菊花枸杞，护眼又降火\n\n💡 赶方案、盯屏幕、连轴转的日子里，眼干、嘴起皮、心里冒火几乎是打工人的常态。老祖宗顺时养生的智慧里，菊花配枸杞是一对老搭档——白菊清润、枸杞养肝，温水一冲就是一杯对屏幕党的友好茶饮。它不是药，但喝对了，确实能让身体少点\"燥\"。我以前也靠冰美式硬撑，结果越喝越虚、下午心慌手抖，换成这杯之后，那种燥劲儿慢慢缓了下来。刚好立秋后燥气渐起，这杯来得正当时。\n\n✦ ✦ ✦\n\n👀 方法一：【基础泡法】 取白菊 5–6 朵、枸杞 10 粒左右，用 85℃ 温水冲泡，盖盖焖 3–5 分钟再喝。我一般上午泡一壶，盯屏间隙小口抿，比冰美式温和，下午也不容易心慌。枸杞别用开水烫，温水更能留住那点清甜。白菊偏清润、黄菊偏散风，护眼降火选白菊更稳妥；枸杞挑颜色自然、不黏手的就好。\n\n✦ ✦ ✦\n\n🌿 方法二：【按需加减】 眼干涩明显，可加一小撮桑叶；最近火气重、口气重，加两片麦冬或少许决明子。但别一锅乱炖，每次加一味就够，量也宜少不宜多。顺时养生讲究\"对症轻调\"，不是堆料越多越好。一周喝个三四次足够，不必天天当水；没泡的食材密封避光存，别受潮。\n\n✦ ✦ ✦\n\n🍵 方法三：【喝对时机】 下午两三点喝最合适，既护眼又不扰眠；别从早灌到晚，也别当水猛喝。脾胃偏寒、容易腹泻或经期时少喝；觉得胃凉就停一停。也别空腹猛灌，饭后半小时更舒服；剩的茶汤别留过夜，现泡现喝最清。茶饮是日常食养，舒服才是标准，别硬扛。\n\n✦ ✦ ✦\n\n✅ 顺时养生不是玄学，是把老祖宗的食养方，嵌进我们赶工的日子。一杯菊花枸杞，护的是眼、降的是火、安的是赶进度时那点燥。花费不过几块钱，却比一堆保健品来得踏实；顺时、对症、适量，才是食养该有的样子。你赶进度时都泡点啥？评论区聊聊～\n\n#顺时养生 #菊花枸杞茶 #护眼茶饮 #降火 #食养方 #打工人的养生 #办公室养生茶 #药食同源\n\n⚠️ 免责声明：本内容为药食同源食材的日常食养分享，非医疗建议，不替代诊断与治疗。体质各异，脾胃虚寒、经期及特殊人群请酌情饮用或咨询专业人士；如长期不适请及时就医。\n\n配图说明（方法数3→共4张）：\n- cover_3x4.png 封面 [菊花枸杞茶|护眼降火]\n- body_1.png 方法一 [白菊枸杞|温水冲泡]\n- body_2.png 方法二 [桑叶麦冬|对症加减]\n- body_3.png 方法三 [下午喝|喝对时机]\n"}, {"id": "2026-08-12_处暑前这碗汤把夏天火气按下", "account": "白哥的顺时食堂", "title": "处暑前这碗汤把夏天火气按下", "category": "", "date": "2026-08-12", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-12 16:18", "publishedAt": null, "summary": "处暑前这碗汤，把夏天火气按下 ✦ ✦ ✦ 💛 入秋前这段\"秋老虎\"尾巴，我最怕身上那股闷火。前阵子天", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-12_%E5%A4%84%E6%9A%91%E5%89%8D%E8%BF%99%E7%A2%97%E6%B1%A4%E6%8A%8A%E5%A4%8F%E5%A4%A9%E7%81%AB%E6%B0%94%E6%8C%89%E4%B8%8B/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-12_%E5%A4%84%E6%9A%91%E5%89%8D%E8%BF%99%E7%A2%97%E6%B1%A4%E6%8A%8A%E5%A4%8F%E5%A4%A9%E7%81%AB%E6%B0%94%E6%8C%89%E4%B8%8B/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-12_%E5%A4%84%E6%9A%91%E5%89%8D%E8%BF%99%E7%A2%97%E6%B1%A4%E6%8A%8A%E5%A4%8F%E5%A4%A9%E7%81%AB%E6%B0%94%E6%8C%89%E4%B8%8B/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-12_%E5%A4%84%E6%9A%91%E5%89%8D%E8%BF%99%E7%A2%97%E6%B1%A4%E6%8A%8A%E5%A4%8F%E5%A4%A9%E7%81%AB%E6%B0%94%E6%8C%89%E4%B8%8B/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-12_%E5%A4%84%E6%9A%91%E5%89%8D%E8%BF%99%E7%A2%97%E6%B1%A4%E6%8A%8A%E5%A4%8F%E5%A4%A9%E7%81%AB%E6%B0%94%E6%8C%89%E4%B8%8B/cover_3x4.png"], "text": "处暑前这碗汤，把夏天火气按下\n\n✦ ✦ ✦\n\n💛 入秋前这段\"秋老虎\"尾巴，我最怕身上那股闷火。前阵子天还热，我脸上冒痘、嘴角起皮、晚上翻来覆去睡不沉，照镜子总觉得哪里\"燥\"得慌。后来翻节气食养的老法子才懂：处暑前这口气，得靠一碗清润的汤慢慢顺下去——不是硬压，是\"润\"着把火气降下来。厨房忙活半小时，喝完一身松，比喝凉茶舒服太多。\n\n✦ ✦ ✦\n\n🌿 方法一：【食材备齐】银耳半朵、雪梨1个、鲜百合30克、枸杞10克。银耳提前冷水泡2小时，撕成小朵；雪梨带皮切块（皮里润燥的成分多，别削）；百合剥瓣洗净。我头回偷懒没泡够时间，煮出来脆硬不出胶，后来老实泡足2小时，汤才黏糊拉丝。食材不用贵，菜场十几块就能凑齐一锅。\n\n✦ ✦ ✦\n\n✨ 方法二：【小火慢炖】所有食材入砂锅，加清水约1200毫升，大火煮开转小火炖40分钟，关火前5分钟放枸杞。全程留条缝防溢，别盖严。炖足40分钟汤色微黄、银耳出胶，喝一口喉咙像被轻轻抚平，胃也不闹。我习惯周末炖一锅，分装两碗工作日带去公司当下午茶。\n\n✦ ✦ ✦\n\n📌 方法三：【搭配点睛】想更清火，加一小把去心莲子同炖；怕寒凉的人撒几粒去核红枣。别一上来就猛加药材，家常食材够用。误区提醒：银耳别用开水泡，会发黏不出胶；枸杞别早放，久煮发酸还掉色。我每周炖2次，分两天温热喝完，放凉后冷藏、喝前重新温热——冰的伤脾，温的最养人。\n\n✦ ✦ ✦\n\n💪 方法四：【饮用时机】下午3-5点（膀胱经当令）喝一碗最顺，借身体排浊的势头把余火带出去；晚上别临睡前猛灌，免得起夜影响睡眠。坚持两周，我嘴角不起皮了，夜里也睡得沉些。你家常炖哪碗汤？评论区告诉我，咱们互相抄作业。\n\n✦ ✦ ✦\n\n🏷️ #处暑食养 #清热润燥汤 #银耳雪梨 #顺时养生 #家常食疗 #夏日清火 #立秋润燥顺时食养 #不吃压力的体质 #护眼202020午休回血\n\n✦ ✦ ✦\n\n💡 免责声明：本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。"}, {"id": "2026-08-13_5款家常润燥汤成本不到20", "account": "白哥的顺时食堂", "title": "5款家常润燥汤成本不到20", "category": "", "date": "2026-08-13", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-13 09:38", "publishedAt": null, "summary": "5款家常润燥汤成本不到20 🍲 处暑快到了，最近换季嗓子干、皮肤也起皮。老祖宗说\"秋燥\"不是玄学——", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_5%E6%AC%BE%E5%AE%B6%E5%B8%B8%E6%B6%A6%E7%87%A5%E6%B1%A4%E6%88%90%E6%9C%AC%E4%B8%8D%E5%88%B020/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_5%E6%AC%BE%E5%AE%B6%E5%B8%B8%E6%B6%A6%E7%87%A5%E6%B1%A4%E6%88%90%E6%9C%AC%E4%B8%8D%E5%88%B020/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_5%E6%AC%BE%E5%AE%B6%E5%B8%B8%E6%B6%A6%E7%87%A5%E6%B1%A4%E6%88%90%E6%9C%AC%E4%B8%8D%E5%88%B020/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_5%E6%AC%BE%E5%AE%B6%E5%B8%B8%E6%B6%A6%E7%87%A5%E6%B1%A4%E6%88%90%E6%9C%AC%E4%B8%8D%E5%88%B020/cover_3x4.png"], "text": "5款家常润燥汤成本不到20\n\n🍲 处暑快到了，最近换季嗓子干、皮肤也起皮。老祖宗说\"秋燥\"不是玄学——肺喜润恶燥，这时候最该给身体加点水。我每周轮着煮几款汤，成本都很低，分享给你。\n\n🌿 【银耳雪梨羹】干银耳1朵泡发撕小，雪梨1个带皮切块，加冰糖小火炖40分钟。我连喝5天，早起喉咙不干了。雪梨别去核，润得更稳，脾胃虚的少放糖。\n\n✨ 【百合莲子汤】鲜百合30克、莲子20克、冰糖少许，加水煮20分钟。睡前喝一小碗，心里那点烦躁也跟着平了。莲子留芯更清心，怕寒的加两片姜。\n\n📌 【山药排骨润燥汤】山药1根、排骨300克、沙参玉竹各10克，焯水后炖1小时。这碗最顶饱，周末炖一锅能喝两天。润燥别乱补，先润脾再谈其他。\n\n💪 处暑前后照着喝一周，比瞎买养生品踏实。你最想先试哪款？还是你有私藏润燥方？评论区聊聊，我去抄作业。\n\n🏷️ #处暑食养 #润燥汤 #节气养生 #家常食疗 #食疗方 #内调外养 #养生日常 #打工人养生 #处暑润燥 #秋燥 #顺时养生 #家常汤水\n\n💡 本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。"}, {"id": "2026-08-13_不靠褪黑素的入睡仪式", "account": "小白情绪养生局", "title": "不靠褪黑素的入睡仪式", "category": "", "date": "2026-08-13", "status": "待发布", "recommended_time": "—", "best_window": "（睡前情绪共鸣时段）", "recommendedTime": "", "compliance": "—", "publish_time": "", "createdAt": "2026-08-13 09:35", "publishedAt": null, "summary": "不靠褪黑素的入睡仪式 💛 最近脑子一到晚上就停不下来，躺下还在反复想明天的事，睁眼到一两点才迷糊睡着", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E4%B8%8D%E9%9D%A0%E8%A4%AA%E9%BB%91%E7%B4%A0%E7%9A%84%E5%85%A5%E7%9D%A1%E4%BB%AA%E5%BC%8F/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E4%B8%8D%E9%9D%A0%E8%A4%AA%E9%BB%91%E7%B4%A0%E7%9A%84%E5%85%A5%E7%9D%A1%E4%BB%AA%E5%BC%8F/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E4%B8%8D%E9%9D%A0%E8%A4%AA%E9%BB%91%E7%B4%A0%E7%9A%84%E5%85%A5%E7%9D%A1%E4%BB%AA%E5%BC%8F/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E4%B8%8D%E9%9D%A0%E8%A4%AA%E9%BB%91%E7%B4%A0%E7%9A%84%E5%85%A5%E7%9D%A1%E4%BB%AA%E5%BC%8F/cover_3x4.png"], "text": "不靠褪黑素的入睡仪式\n\n💛 最近脑子一到晚上就停不下来，躺下还在反复想明天的事，睁眼到一两点才迷糊睡着。后来我不跟自己较劲了，慢慢摸索出一套睡前小仪式，今晚就和你一起试试。\n\n🌿 【4-7-8呼吸法】躺好闭上眼，用鼻子吸气4秒、憋气7秒、嘴巴慢呼8秒，重复5组。我坚持一周后，心跳真的稳了，从睁眼到睡着大概缩短到20分钟。注意别憋到心慌，舒服就好。\n\n✨ 【手机倒扣】睡前30分钟把手机屏幕朝下扣在床头柜，调成静音。我试过三天，脑子不再被消息勾着，入睡前的杂念少了一大半，这比硬扛有效。\n\n📌 【温水泡脚】40℃左右温水泡脚15分钟，水没过脚踝，泡完全身暖暖的上床。我现在几乎天天做，手脚暖了整个人就松下来，冬天尤其明显。\n\n💪 今晚不妨先挑一个做起，不用全做。你睡前最常卡在哪一步？是脑子停不下来，还是手机放不下？评论区告诉我，咱们互相抄作业。\n\n🏷️ #失眠自救 #睡前仪式 #4-7-8呼吸法 #不靠褪黑素 #睡眠改善 #情绪养生 #焦虑缓解 #助眠方法 #养生日常 #打工人养生\n\n💡 本文为情绪陪伴与日常养生分享，不替代专业医疗诊断与治疗。如您有严重身心不适，请前往正规医疗机构咨询专业医生。"}, {"id": "2026-08-13_压力大的女生这样吃才瘦", "account": "白哥的顺时食堂", "title": "压力大的女生这样吃才瘦", "category": "", "date": "2026-08-13", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-13 18:40", "publishedAt": null, "summary": "压力大的女生这样吃才瘦 ✦ ✦ ✦ 💛 最近是不是总觉得\"明明没多吃，腰腹却一圈圈长\"？压力大的时候", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E5%8E%8B%E5%8A%9B%E5%A4%A7%E7%9A%84%E5%A5%B3%E7%94%9F%E8%BF%99%E6%A0%B7%E5%90%83%E6%89%8D%E7%98%A6/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E5%8E%8B%E5%8A%9B%E5%A4%A7%E7%9A%84%E5%A5%B3%E7%94%9F%E8%BF%99%E6%A0%B7%E5%90%83%E6%89%8D%E7%98%A6/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E5%8E%8B%E5%8A%9B%E5%A4%A7%E7%9A%84%E5%A5%B3%E7%94%9F%E8%BF%99%E6%A0%B7%E5%90%83%E6%89%8D%E7%98%A6/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E5%8E%8B%E5%8A%9B%E5%A4%A7%E7%9A%84%E5%A5%B3%E7%94%9F%E8%BF%99%E6%A0%B7%E5%90%83%E6%89%8D%E7%98%A6/cover_3x4.png"], "text": "压力大的女生这样吃才瘦\n\n✦ ✦ ✦\n\n💛 最近是不是总觉得\"明明没多吃，腰腹却一圈圈长\"？压力大的时候，身体会悄悄分泌更多皮质醇，这种激素最爱把脂肪往肚子上囤，还会让你深夜疯狂想吃甜的、碳水。我以前也以为胖就是懒、就是管不住嘴，后来才懂——很多女生的\"压力肥\"，是情绪和身体在替你扛。与其硬饿，不如用厨房里几样顺手的食材，把身体哄回正轨。我是白哥，今天不灌鸡汤，只给你能上桌的三碗方子。\n\n✦ ✦ ✦\n\n🌿 方法一：【睡前一碗安神羹】桂圆肉、百合、银耳小火炖成羹，睡前一小时温温热热喝一小碗。压力大的人多半睡不沉，而睡不好皮质醇就下不来，脂肪就囤得住。这碗羹不用药，就是日常食材，喝完胃里暖暖的，人容易松下来。误区：别加太多冰糖，甜过头反而升血糖；也别当宵夜吃到撑，一小碗刚好，否则夜里消化负担更重。\n\n✦ ✦ ✦\n\n✨ 方法二：【午后一杯疏肝茶】玫瑰花3朵、陈皮一小片，热水焖泡当水喝。生气、焦虑、憋屈的时候，很多人会无意识狂吃，这杯茶帮你把那股\"堵着的气\"顺一顺，嘴馋的冲动就淡了。我下午三点最想点奶茶，换成它之后，那股非吃不可的劲儿真的会过去。注意：经期量多的女生减量，孕期别乱喝花草。\n\n✦ ✦ ✦\n\n📌 方法三：【早餐把血糖稳住】别再空腹灌黑咖啡赶地铁了。换成燕麦+鸡蛋+半颗牛油果或一把莓果，蛋白质和健康脂肪先打底，一上午不闹饿、不吃同事的饼干。血糖稳了，皮质醇就不会被饿出来，中午也不容易报复性点外卖。这一步比\"少吃\"管用太多，人也更有精神。\n\n✦ ✦ ✦\n\n💪 三样都不贵、不麻烦，关键是顺着身体而不是跟它对着干。压力肥不是你的错，别再骂自己懒。先把睡前的羹、午后的茶、早上的那顿饭换一换，两周看腰围会不会松一点。你压力一大最爱 craving 什么？评论区说，我帮你配对应的食方。\n\n✦ ✦ ✦\n\n🏷️ #压力肥 #皮质醇降醇 #情绪性进食 #食疗瘦身 #顺时养生 #女生减脂 #稳住血糖 #轻养生 #白哥的顺时食堂 #不饿肚子瘦\n\n✦ ✦ ✦\n\n💡 免责声明：本文为食疗食养与生活调理分享，内容仅供参考，不替代专业医疗诊断与治疗。如有内分泌或代谢相关疾病，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-13_坐着练八段锦同事看不出", "account": "白领阿白自救记", "title": "坐着练八段锦同事看不出", "category": "", "date": "2026-08-13", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-13 13:33", "publishedAt": null, "summary": "坐着练八段锦同事看不出 ✦ ✦ ✦ 💛 工位一坐就是八九个小时，肩颈僵得像石板，去健身房根本挤不出时", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E5%9D%90%E7%9D%80%E7%BB%83%E5%85%AB%E6%AE%B5%E9%94%A6%E5%90%8C%E4%BA%8B%E7%9C%8B%E4%B8%8D%E5%87%BA/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E5%9D%90%E7%9D%80%E7%BB%83%E5%85%AB%E6%AE%B5%E9%94%A6%E5%90%8C%E4%BA%8B%E7%9C%8B%E4%B8%8D%E5%87%BA/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E5%9D%90%E7%9D%80%E7%BB%83%E5%85%AB%E6%AE%B5%E9%94%A6%E5%90%8C%E4%BA%8B%E7%9C%8B%E4%B8%8D%E5%87%BA/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-13_%E5%9D%90%E7%9D%80%E7%BB%83%E5%85%AB%E6%AE%B5%E9%94%A6%E5%90%8C%E4%BA%8B%E7%9C%8B%E4%B8%8D%E5%87%BA/cover_3x4.png"], "text": "坐着练八段锦同事看不出\n\n✦ ✦ ✦\n\n💛 工位一坐就是八九个小时，肩颈僵得像石板，去健身房根本挤不出时间。很多人觉得养生得专门抽空、换上运动服才叫练，其实老祖宗的八段锦坐着就能练，动作小到隔壁同事完全看不出来。我之前也总找借口拖着，直到体检报告亮黄灯才急着改——后来发现每天零碎加起来练十几分钟就够。\n\n✦ ✦ ✦\n\n🌿 方法一：【双手托天理三焦】坐直，双手从腹前慢慢上托过头顶，掌心向上停3秒，再缓缓落回，重复5组。我每次开完会偷偷做，看着就像伸个懒腰，谁也没发现。做完上半身像被轻轻拉开，肩膀那股紧绷松了一大半。注意别耸肩，托举时配合吸气、落回时慢慢呼气，舒展感更明显；连续做5天，原本下午必犯的肩酸都推迟到快下班才来。尤其适合空调房里越坐越冷的人，循环也跟着暖起来。\n\n✦ ✦ ✦\n\n✨ 方法二：【左右开弓似射雕】一手扶桌沿当\"弓\"，另一手向前平推像拉弓，左右各停4秒，交替8次。这动作看着就像扶眼镜琢磨方案，完全不突兀。午休前做一组，下午敲键盘手都不那么僵，连带鼠标手也缓了。误区是别真用力硬拉，幅度到位、肩胛收紧就够，否则反而容易拉伤。\n\n✦ ✦ ✦\n\n📌 方法三：【五劳七伤往后瞧】头慢慢转向左后、右后各停3秒，像在找身后同事，左右各5次。注意只转头不转肩，幅度别太大，转到有微微拉伸感就停。我下午犯困时做，脖子咔咔响完，脑子都清醒些，比硬扛咖啡管用。三招加起来其实也就两三分钟。\n\n✦ ✦ ✦\n\n💪 别小看这几分钟碎片运动，累积一个月，体态和精气神都会不一样。这三招全是\"隐形\"的，开会、等消息的空档就能来一组，一天零散做三四回。你工位上最僵的是哪？评论区告诉我，下次出专门针对它的动作。不用等周一，今天工位上就能悄悄开始。\n\n✦ ✦ ✦\n\n🏷️ #办公室养生 #八段锦 #打工人养生 #隐形运动 #肩颈放松 #工位拉伸 #碎片化运动 #久坐自救 #工位微八段锦 #轻养生 #摸鱼养生 #肩颈腰松解\n\n✦ ✦ ✦\n\n💡 免责声明：本文为办公室养生与久坐自救分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有严重身体不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-14_别把自我活成别人的KPI", "account": "小白情绪养生局", "title": "别把自我活成别人的KPI", "category": "", "date": "2026-08-14", "status": "待发布", "recommended_time": "—", "best_window": "（睡前情绪共鸣时段）", "recommendedTime": "", "compliance": "—", "publish_time": "", "createdAt": "2026-08-14 09:50", "publishedAt": null, "summary": "别把自我活成别人的KPI ✦ ✦ ✦ 💛 你有没有算过，一天里有多少决定是替别人做的？周末陪朋友逛街", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E5%88%AB%E6%8A%8A%E8%87%AA%E6%88%91%E6%B4%BB%E6%88%90%E5%88%AB%E4%BA%BA%E7%9A%84KPI/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E5%88%AB%E6%8A%8A%E8%87%AA%E6%88%91%E6%B4%BB%E6%88%90%E5%88%AB%E4%BA%BA%E7%9A%84KPI/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E5%88%AB%E6%8A%8A%E8%87%AA%E6%88%91%E6%B4%BB%E6%88%90%E5%88%AB%E4%BA%BA%E7%9A%84KPI/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E5%88%AB%E6%8A%8A%E8%87%AA%E6%88%91%E6%B4%BB%E6%88%90%E5%88%AB%E4%BA%BA%E7%9A%84KPI/cover_3x4.png"], "text": "别把自我活成别人的KPI\n\n✦ ✦ ✦\n\n💛 你有没有算过，一天里有多少决定是替别人做的？周末陪朋友逛街、加班帮同事改方案、回消息秒回怕对方不高兴……我前阵子突然发现，自己像一台永远在响应别人指令的机器，唯独忘了自己想要什么。那种\"为了不让别人失望\"的紧绷，比加班还累。今天想和你聊聊，怎么把\"自我\"一点点找回来。\n\n✦ ✦ ✦\n\n🌿 方法一：【划一道情绪边界】。每天睡前花 5 分钟，把当天的事分成两栏：左边写\"别人的期待\"（\"该回她消息了\"\"得答应那顿饭\"），右边写\"我的真实感受\"（\"其实我想早点睡\"\"我并不想去\"）。坚持 2 周后，我明显能分清：哪些忙该帮，哪些只是在讨好。边界不是冷漠，是让你有余力去爱人。\n\n✦ ✦ ✦\n\n✨ 方法二：【留一段专属留白】。无论多忙，每天给自己 15 分钟\"什么都不为别人\"的时间——不回消息、不刷工作群，泡杯茶坐在窗边发会儿呆，或做一组肩颈拉伸。刚开始我总愧疚地想\"还有事没做\"，但坚持 3 周后，这 15 分钟成了全天最稳的锚点，焦虑反而一点点降了下来。\n\n✦ ✦ ✦\n\n📌 方法三：【写下三个真实愿望】。拿一张便签，写下这周\"只为自己\"想做的三件小事，比如\"一个人看场电影\"\"买一支喜欢很久的口红\"，贴在镜子上。我每周日晚上回顾一次，完成的打勾，没做的问自己：\"是真的没空，还是又让给了别人？\"半年下来，便签从空白变得满满当当，我才真正开始为自己活。\n\n✦ ✦ ✦\n\n💪 我们这一生，KPI 是别人的，日子却是自己的。试着从今天的一个小边界、15 分钟留白、三个愿望开始，把\"自我\"重新养回来。你最近一次纯粹为自己做的事是什么？评论区告诉我，我们一起慢慢找回来。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#情绪养生 #讨好型人格 #自我边界 #停止内耗 #爱自己 #日常养生 #玻璃碴里捡花 #2026松弛感挑战 #情绪内耗自救 #不打压力稳皮质醇\n\n✦ ✦ ✦\n\n💡 免责声明：本文为情绪陪伴与日常养生分享，不替代专业医疗诊断与治疗。如您有严重身心不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-14_工位隐形微运动", "account": "白领阿白自救记", "title": "工位隐形微运动", "category": "", "date": "2026-08-14", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-14 09:14", "publishedAt": null, "summary": "坐一天腰快断了?3个隐形动作偷偷救 ✦ ✦ ✦ 💼 又是坐了一整天吧，起身的瞬间腰像断了一样，肩颈也", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E5%B7%A5%E4%BD%8D%E9%9A%90%E5%BD%A2%E5%BE%AE%E8%BF%90%E5%8A%A8/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E5%B7%A5%E4%BD%8D%E9%9A%90%E5%BD%A2%E5%BE%AE%E8%BF%90%E5%8A%A8/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E5%B7%A5%E4%BD%8D%E9%9A%90%E5%BD%A2%E5%BE%AE%E8%BF%90%E5%8A%A8/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E5%B7%A5%E4%BD%8D%E9%9A%90%E5%BD%A2%E5%BE%AE%E8%BF%90%E5%8A%A8/cover_3x4.png"], "text": "坐一天腰快断了?3个隐形动作偷偷救\n\n✦ ✦ ✦\n\n💼 又是坐了一整天吧，起身的瞬间腰像断了一样，肩颈也僵成块。我也天天对着电脑，以前总觉得养生得去健身房，后来发现：在工位上\"偷\"做的几个小动作，比周末猛练两小时还顶用。重点是——同事根本看不出来，你只是在认真打字。今天把3个我天天用的给你，不用换衣服、不流汗。\n\n✦ ✦ ✦\n\n🌿 方法一：【靠墙静站】吃完饭或工间，后脑勺、肩膀、屁股、小腿肚贴紧墙，静静站3分钟。这招能悄悄矫正驼背、把塌下去的腰提起来，还能加速饭后消化。我下午三点腰最酸时站一会儿，再坐下整个人是\"被撑直\"的，不再是软塌塌摊着。\n\n✦ ✦ ✦\n\n✨ 方法二：【座椅脊柱扭转】坐直，双手叉腰，腰部缓缓左右扭转，每侧停3秒，做1分钟；屁股只坐椅子前1/2，收紧核心。这能松动久坐卡住的腰椎、给腰眼松土。我连开两小时会就转几圈，起来时腰不那么硬了。提醒：动作要慢，别拧麻花似的猛转。\n\n✦ ✦ ✦\n\n📌 方法三：【护眼+肩颈组合】双手搓热捂住双眼10秒，缓慢转眼球各10圈，再双肩向后绕圈15次。一套下来眼睛不干涩、富贵包也松了。我盯屏幕两小时必做，做完头是清的、肩是松的。别趴桌午睡，醒来脖子更酸——宁可靠这组合撑一下。\n\n✦ ✦ ✦\n\n💪 别等腰真断了才管。每坐1小时，挑上面一个动作做1分钟，一天攒下来比你想的多。你腰最疼还是脖子最僵？评论区说说，下次专写你最痛的那块。\n\n✦ ✦ ✦\n\n🏷️ #工位养生 #久坐自救 #肩颈放松 #碎片化运动 #打工人养生 #办公室微运动 #腰酸背痛 #隐形健身 #八段锦\n\n✦ ✦ ✦\n\n💡 本文为办公室养生与久坐自救分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有严重身体不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-14_打工人的反内耗养生指南", "account": "小白情绪养生局", "title": "打工人的反内耗养生指南", "category": "", "date": "2026-08-14", "status": "待发布", "recommended_time": "—", "best_window": "（睡前情绪共鸣时段）", "recommendedTime": "", "compliance": "—", "publish_time": "", "createdAt": "2026-08-14 16:13", "publishedAt": null, "summary": "打工人的反内耗养生指南 ✦ ✦ ✦ 💛 你有没有过这种时刻：明明下班了，脑子还在重播白天说错的那句话", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E6%89%93%E5%B7%A5%E4%BA%BA%E7%9A%84%E5%8F%8D%E5%86%85%E8%80%97%E5%85%BB%E7%94%9F%E6%8C%87%E5%8D%97/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E6%89%93%E5%B7%A5%E4%BA%BA%E7%9A%84%E5%8F%8D%E5%86%85%E8%80%97%E5%85%BB%E7%94%9F%E6%8C%87%E5%8D%97/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E6%89%93%E5%B7%A5%E4%BA%BA%E7%9A%84%E5%8F%8D%E5%86%85%E8%80%97%E5%85%BB%E7%94%9F%E6%8C%87%E5%8D%97/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E6%89%93%E5%B7%A5%E4%BA%BA%E7%9A%84%E5%8F%8D%E5%86%85%E8%80%97%E5%85%BB%E7%94%9F%E6%8C%87%E5%8D%97/cover_3x4.png"], "text": "打工人的反内耗养生指南\n\n✦ ✦ ✦\n\n💛 你有没有过这种时刻：明明下班了，脑子还在重播白天说错的那句话；周末想躺平，却因为\"别人都在卷\"而慌得不敢休息。那种明明没干活却累到散架的虚脱感，比连续加班还耗人。我以前总把内耗当成意志力不够，直到有天照镜子，发现自己脸色灰得像被抽干了电。后来才懂，反内耗不是硬扛，而是给情绪和身体都松绑。今天把我亲测有用的 3 个小法分享给你。\n\n✦ ✦ ✦\n\n🌿 方法一：【把\"复盘\"关进盒子里】。每天下班前花 5 分钟，把今天纠结的事、没说好的话，全写在一张便签上，然后对折塞进抽屉——意思是\"今天的工作到此为止\"。便签不用写得好看，写满就够。坚持 3 周后，我半夜惊醒的次数从一周 4 次降到 1 次。脑子不再循环播放，睡眠和脸色都慢慢回来了。\n\n✦ ✦ ✦\n\n✨ 方法二：【给身体一个下班仪式】。到家先不碰手机，用 3 分钟做一组肩颈拉伸，再用热水泡个脚，把\"公司的人\"和\"回家的人\"切开。我试了 2 周，原来一进门还紧绷的肩膀，现在能一点点松下来。身体先放松，心里那根弦才敢跟着松。\n\n✦ ✦ ✦\n\n📌 方法三：【允许自己虚度半天】。每周留半天，不回消息、不学新东西、不逼自己成长，只是发呆、晒太阳、煮一碗汤。一开始我愧疚得手心冒汗，但第 4 次之后，那半天成了我一周里最充电的时刻。允许无聊，本身就是一种悄悄的修复。反内耗的底层，是先学会不对\"休息\"感到抱歉。\n\n✦ ✦ ✦\n\n💪 内耗像一个悄悄漏电的 App，你越不理它，电量掉得越快。从今天起，把复盘关进盒子、给身体一个下班仪式、允许自己虚度半天——把电一点点攒回来。你最近一次\"毫不愧疚地休息\"是什么时候？评论区告诉我，我们一起练习松下来。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#情绪养生 #停止内耗 #打工人养生 #反内耗 #爱自己 #日常养生 #松弛感 #职场情绪自救 #不打压力稳皮质醇 #2026松弛感挑战\n\n✦ ✦ ✦\n\n💡 免责声明：本文为情绪陪伴与日常养生分享，不替代专业医疗诊断与治疗。如您有严重身心不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-14_焦虑不全是心里事可能是激素在闹", "account": "小白情绪养生局", "title": "焦虑不全是心里事可能是激素在闹", "category": "", "date": "2026-08-14", "status": "待发布", "recommended_time": "—", "best_window": "（睡前情绪共鸣时段）", "recommendedTime": "", "compliance": "—", "publish_time": "", "createdAt": "2026-08-14 22:04", "publishedAt": null, "summary": "焦虑不全是心里事，可能是激素在闹 ✦ ✦ ✦ 🌙 有很长一段时间，我以为自己\"心态太差\"——明明没什", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%84%A6%E8%99%91%E4%B8%8D%E5%85%A8%E6%98%AF%E5%BF%83%E9%87%8C%E4%BA%8B%E5%8F%AF%E8%83%BD%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E9%97%B9/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%84%A6%E8%99%91%E4%B8%8D%E5%85%A8%E6%98%AF%E5%BF%83%E9%87%8C%E4%BA%8B%E5%8F%AF%E8%83%BD%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E9%97%B9/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%84%A6%E8%99%91%E4%B8%8D%E5%85%A8%E6%98%AF%E5%BF%83%E9%87%8C%E4%BA%8B%E5%8F%AF%E8%83%BD%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E9%97%B9/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%84%A6%E8%99%91%E4%B8%8D%E5%85%A8%E6%98%AF%E5%BF%83%E9%87%8C%E4%BA%8B%E5%8F%AF%E8%83%BD%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E9%97%B9/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%84%A6%E8%99%91%E4%B8%8D%E5%85%A8%E6%98%AF%E5%BF%83%E9%87%8C%E4%BA%8B%E5%8F%AF%E8%83%BD%E6%98%AF%E6%BF%80%E7%B4%A0%E5%9C%A8%E9%97%B9/cover_3x4.png"], "text": "焦虑不全是心里事，可能是激素在闹\n\n✦ ✦ ✦\n\n🌙 有很长一段时间，我以为自己\"心态太差\"——明明没什么大事，就是莫名心慌、睡不踏实、一点小事就想哭。后来才知道，焦虑有时候真不是我想太多，是身体里的激素在闹脾气。我不是学医的，只是把摸索到的一点小经验分享给你，也许能让你对自己温柔一点。\n\n✦ ✦ ✦\n\n🍂 方法一：【皮质醇·别跟深夜较劲】压力一大，身体会一直分泌皮质醇（就是\"压力激素\"）。我最明显的体会是：越熬夜刷手机，第二天越像绷着的弦。后来我给自己定规矩，晚上十一点手机放客厅，改看十分钟纸质书或听白噪音。坚持两周，那种\"躺下脑子还在跑\"的紧绷松了不少。⚠️ 坑：别指望一晚就好，激素调整是慢功夫，给自己点耐心。\n\n✦ ✦ ✦\n\n☀️ 方法二：【血清素·每天晒十分钟】血清素是让人安稳的\"快乐递质\"，它的原料很大部分靠 daylight 触发。我以前一到阴天就情绪低落，现在每天上午出门晒十分钟太阳，哪怕只是下楼取快递。暖暖的光打在脸上，那股说不清的丧，会慢慢退潮。⚠️ 坑：隔着玻璃晒几乎没用，真得走到窗外的光里。\n\n✦ ✦ ✦\n\n🌿 方法三：【经期前后·给自己松绑】女生每个月激素起伏很大，经前那几天特别容易焦虑、敏感、想哭，真不是你矫情。我现在会在日历上标出那几天，提前把重要决定往后挪，允许自己少做一点、多躺一会儿。承认\"这几天我就是需要被照顾\"，反而没那么内耗了。⚠️ 坑：别在那几天逼自己做重大决策或难啃的事。\n\n✦ ✦ ✦\n\n💛 方法四：【血糖·别空腹硬扛】饿过头的时候，血糖掉下来，人也会莫名烦躁心慌，跟焦虑一模一样。我现在包里常备一小把坚果，下午三四点准时垫一口，不再等到饿到发抖才吃饭。稳住血糖，情绪也跟着稳了半截。⚠️ 坑：别用奶茶蛋糕猛补，糖 spike 之后跌得更狠。\n\n✦ ✦ ✦\n\n📌 说到底，焦虑不全是心里事——身体这台机器的小波动，也会悄悄推着我们情绪走。我不是要你忽略心事，只是想说：当你又责怪自己\"怎么又想太多\"时，也许可以先问问身体：今天晒够太阳了吗？睡够了吗？吃饱了吗？把自己当个会累、会闹小脾气的朋友，而不是需要被修理的故障，会轻松很多。你最近一次莫名心慌，是在什么场景？评论区聊聊，我们一起慢慢接住自己。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#焦虑自救 #情绪养生 #激素与情绪 #皮质醇 #好好睡觉 #女生养生 #身心同调 #温柔待己\n\n✦ ✦ ✦\n\n💡 免责声明：本文为情绪养生与身心同调的日常分享，内容仅供参考，不替代专业医疗诊断与治疗。如你长期焦虑、情绪严重影响生活，请前往正规医疗机构或寻求专业心理咨询帮助。\n"}, {"id": "2026-08-14_睡前478呼吸法", "account": "小白情绪养生局", "title": "睡前478呼吸法", "category": "", "date": "2026-08-14", "status": "待发布", "recommended_time": "—", "best_window": "（睡前情绪共鸣时段）", "recommendedTime": "", "compliance": "—", "publish_time": "", "createdAt": "2026-08-14 09:14", "publishedAt": null, "summary": "脑子停不下来?4-7-8呼吸法哄自己睡 ✦ ✦ ✦ 💛 昨晚又是一点还睁着眼吧。白天没做完的工作、和", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%9D%A1%E5%89%8D478%E5%91%BC%E5%90%B8%E6%B3%95/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%9D%A1%E5%89%8D478%E5%91%BC%E5%90%B8%E6%B3%95/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%9D%A1%E5%89%8D478%E5%91%BC%E5%90%B8%E6%B3%95/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%9D%A1%E5%89%8D478%E5%91%BC%E5%90%B8%E6%B3%95/cover_3x4.png"], "text": "脑子停不下来?4-7-8呼吸法哄自己睡\n\n✦ ✦ ✦\n\n💛 昨晚又是一点还睁着眼吧。白天没做完的工作、和朋友的争执、下个月的账单，在脑子里轮番播。我以前越告诉自己\"快睡\"，越清醒，数羊数到三百还是瞪着眼。后来才懂：睡不着不是意志力差，是身体还卡在\"紧张模式\"。也是从那阵子起，我把\"睡好\"从待办清单里划掉，改成\"先躺平\"。我试了几招\"把身体切回休息模式\"的小练习，今晚陪你一起试试，不焦虑地躺下。\n\n✦ ✦ ✦\n\n🌿 方法一：【4-7-8呼吸法】用鼻子慢慢吸气4秒，屏住呼吸7秒，再用嘴缓缓呼气8秒，重复3到5组。关键是呼气时长拉到吸气的两倍，能直接激活副交感神经、把心率按下来。我脑子乱得睡不着时做4组，心跳明显往下掉，杂念也跟着慢下来。很多博主说深呼吸没用，其实是节奏错了——慢下来才有效。小提醒：别大口猛喘，否则反而手麻心慌。\n\n✦ ✦ ✦\n\n✨ 方法二：【渐进式肌肉放松】平躺，从脚趾开始，依次把小腿、大腿、肚子、手、肩膀、脸绷紧5秒，再突然完全放松，从下往上走一遍。我第一次做才发现肩膀一直梗着、眉头也皱着，松开那一下整个人像泄了气的气球。尤其适合白天一直敲键盘、肩膀耸到耳朵的人。不用想着\"快睡着\"，只专注紧绷和放松的差别，练个三五天身体一做就自动卸力。\n\n✦ ✦ ✦\n\n📌 方法三：【正念身体扫描】把注意力像扫描仪一样，从脚趾慢慢移到头顶，不评判，只静静感受每个部位是凉是热、和床单接触什么感觉。我常卡在脑子里复盘工作，扫到腰部时就忘了刚才想的事。不用担心做不对，扫描到哪算哪，走神了就轻轻拉回来。每天睡前5分钟，比刷半小时短视频管用太多，脑子是空的，身体是松的。\n\n✦ ✦ ✦\n\n💪 今晚别跟自己较劲。脑子停不下来时，先调呼吸（4-7-8），再松肌肉，最后扫一遍身体。要是躺了快20分钟还清醒，就起来坐会儿，别硬扛。你试过哪个？评论区告诉我，咱们一起慢慢把觉睡好。\n\n✦ ✦ ✦\n\n🏷️ #失眠自救 #睡前仪式 #助眠小技巧 #睡眠改善 #478呼吸法 #睡前疗愈 #放松练习 #情绪养生 #焦虑缓解\n\n✦ ✦ ✦\n\n💡 本文为情绪陪伴与日常养生分享，不替代专业医疗诊断与治疗。如您有严重身心不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-14_碎时间养生比下班跑步管用", "account": "白领阿白自救记", "title": "碎时间养生比下班跑步管用", "category": "", "date": "2026-08-14", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-14 20:37", "publishedAt": null, "summary": "碎时间养生，比下班跑步还管用 ✦ ✦ ✦ 🌸 以前我也信\"养生就得下班去跑步\"，结果加班一多，跑步计", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%A2%8E%E6%97%B6%E9%97%B4%E5%85%BB%E7%94%9F%E6%AF%94%E4%B8%8B%E7%8F%AD%E8%B7%91%E6%AD%A5%E7%AE%A1%E7%94%A8/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%A2%8E%E6%97%B6%E9%97%B4%E5%85%BB%E7%94%9F%E6%AF%94%E4%B8%8B%E7%8F%AD%E8%B7%91%E6%AD%A5%E7%AE%A1%E7%94%A8/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%A2%8E%E6%97%B6%E9%97%B4%E5%85%BB%E7%94%9F%E6%AF%94%E4%B8%8B%E7%8F%AD%E8%B7%91%E6%AD%A5%E7%AE%A1%E7%94%A8/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%A2%8E%E6%97%B6%E9%97%B4%E5%85%BB%E7%94%9F%E6%AF%94%E4%B8%8B%E7%8F%AD%E8%B7%91%E6%AD%A5%E7%AE%A1%E7%94%A8/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%A2%8E%E6%97%B6%E9%97%B4%E5%85%BB%E7%94%9F%E6%AF%94%E4%B8%8B%E7%8F%AD%E8%B7%91%E6%AD%A5%E7%AE%A1%E7%94%A8/cover_3x4.png"], "text": "碎时间养生，比下班跑步还管用\n\n✦ ✦ ✦\n\n🌸 以前我也信\"养生就得下班去跑步\"，结果加班一多，跑步计划连断三周，人反而更虚。后来我把养生塞进每天本来就有的空当——通勤、开会、午休、睡前，那些被我刷手机浪费掉的碎时间。坚持一个多月，最明显的不是瘦了，是下午三点不再犯困、肩颈不僵，整个人像被重新充了电。\n\n✦ ✦ ✦\n\n💼 方法一：【通勤路上·踮脚收腹】地铁上别光刷短视频，单脚踮脚 30 秒换另一只，重复 5 组；等车就靠墙站，后脑勺、肩、臀、脚跟贴墙，收腹提肛。我每天通勤 40 分钟，能塞进差不多 10 分钟微运动，到公司腿不肿、精神也在线。⚠️ 坑：踮脚扶稳扶手，别在拥挤车厢晃到别人。\n\n✦ ✦ ✦\n\n☕️ 方法二：【会议间隙·转颈扩胸】开会最伤脖子，我给自己定了规矩：每听 45 分钟就偷偷转两下脖子（缓慢左右各 3 圈）、扩胸 5 次。鼠标手酸了就握拳张开 10 次。同事以为我在记笔记，其实在救命。坚持下来，落枕从一个月两三次降到几乎没有。⚠️ 坑：转脖子别猛甩，慢一点才不伤椎间盘。\n\n✦ ✦ ✦\n\n✨ 方法三：【午休碎片·闭眼远眺】午休我不再趴桌睡（醒来更晕），改成闭眼 10 分钟 + 站窗边远眺 5 分钟。眼睛从屏幕移开，脑子也跟着歇。下午开工那股\"刚睡醒的懵\"没了，效率反而高。⚠️ 坑：闭眼前定个闹钟，别一闭眼真睡过去耽误开工。\n\n✦ ✦ ✦\n\n📌 方法四：【睡前碎片·抬腿泡脚】回家累瘫也别直接瘫沙发。睡前靠墙抬腿 5 分钟（腿麻就放下），或者泡脚 15 分钟（水温 40 度左右，别烫）。我固定二选一，身体慢慢切换到\"休息模式\"，入睡比以前快。⚠️ 坑：女生经期、下肢静脉曲张别久泡；抬腿后别猛起，缓一缓。\n\n✦ ✦ ✦\n\n🌿 碎时间养生说白了就是\"不跟自己较劲\"——跑步总被加班打断，碎时间却雷打不动。把养生塞进本来就有的空当，比逼自己去跑步更可持续，也更像普通人能坚持的样子。你每天最碎的那段时间在干嘛？评论区聊聊，咱一起把班儿上得没那么累。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#碎时间养生 #久坐自救 #办公室养生 #打工人养生 #养生日常 #白领日常 #碎片化运动 #不跑步也养生\n\n✦ ✦ ✦\n\n💡 免责声明：本文为办公室养生与久坐自救的日常分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-14_立秋白色食材润燥", "account": "白哥的顺时食堂", "title": "立秋白色食材润燥", "category": "", "date": "2026-08-14", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-14 09:14", "publishedAt": null, "summary": "夏秋换季嗓子干?3样白色食材煮着润 ✦ ✦ ✦ 🍵 立秋过了快一周，你有没有觉得嗓子发干、皮肤也紧巴", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%AB%8B%E7%A7%8B%E7%99%BD%E8%89%B2%E9%A3%9F%E6%9D%90%E6%B6%A6%E7%87%A5/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%AB%8B%E7%A7%8B%E7%99%BD%E8%89%B2%E9%A3%9F%E6%9D%90%E6%B6%A6%E7%87%A5/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%AB%8B%E7%A7%8B%E7%99%BD%E8%89%B2%E9%A3%9F%E6%9D%90%E6%B6%A6%E7%87%A5/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E7%AB%8B%E7%A7%8B%E7%99%BD%E8%89%B2%E9%A3%9F%E6%9D%90%E6%B6%A6%E7%87%A5/cover_3x4.png"], "text": "夏秋换季嗓子干?3样白色食材煮着润\n\n✦ ✦ ✦\n\n🍵 立秋过了快一周，你有没有觉得嗓子发干、皮肤也紧巴巴的？老话说\"秋燥伤肺\"，这时候最该\"白色入肺、滋阴润燥\"。我前几年一到秋天就狂喝水还是干，后来跟着节气把厨房换成白色食材，才真的润下来。今天把3样我家常备的分享给你，食材常见、做法不费事。\n\n✦ ✦ ✦\n\n🌿 方法一：【雪梨百合羹】雪梨1个带皮切块，加干百合15克、泡发银耳1朵、冰糖少许，小火炖40分钟出胶。雪梨生津、百合清心安神，喝完喉咙像被温毛巾敷过。我连续喝了一周，早起嗓子不再像砂纸。脾胃虚寒的姐妹少放糖、别冰镇，温热喝最舒服。\n\n✦ ✦ ✦\n\n✨ 方法二：【山药莲子粥】铁棍山药250克去皮切段，加莲子15克、小米一把，晨起慢熬成粥。山药健脾、莲子安神，是夏天过后养脾胃的\"软黄金\"。我每周煮三四次当早餐，胃不胀了、下午也不容易垮。小贴士：山药黏液痒手，戴手套或焯水5分钟再处理。\n\n✦ ✦ ✦\n\n📌 方法三：【陈皮雪梨水】陈皮3克加几片雪梨，清水煮20分钟，放温喝。陈皮理气、雪梨润燥，尤其适合痰多、舌苔厚腻的痰湿体质，比单喝雪梨水不容易生痰。我饭后灌一杯，胸口那股闷气像被顺开了。注意：血糖偏高的把冰糖省掉，孕妇忌薏米之类凉性料。\n\n✦ ✦ ✦\n\n💪 秋燥不是一天来的，润燥也别指望一顿灵。把这三样轮换着煮，比乱买滋补品踏实。你秋天最怕哪种干？嗓子、皮肤还是鼻子？评论区聊聊，下回接着聊对症的方子。\n\n✦ ✦ ✦\n\n🏷️ #立秋润燥 #秋燥食疗 #雪梨百合 #白色润肺 #顺时养生 #节气食养 #养生日常 #食疗方子 #处暑养生\n\n✦ ✦ ✦\n\n💡 本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-14_薏米莲子花生汤72天换张脸", "account": "白哥的顺时食堂", "title": "薏米莲子花生汤72天换张脸", "category": "", "date": "2026-08-14", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-14 20:03", "publishedAt": null, "summary": "薏米莲子花生汤，72天换张脸 ✦ ✦ ✦ 💛 以前我一到换季脸就暗沉、起皮，粉底都卡纹。后来跟着懂食", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%96%8F%E7%B1%B3%E8%8E%B2%E5%AD%90%E8%8A%B1%E7%94%9F%E6%B1%A472%E5%A4%A9%E6%8D%A2%E5%BC%A0%E8%84%B8/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%96%8F%E7%B1%B3%E8%8E%B2%E5%AD%90%E8%8A%B1%E7%94%9F%E6%B1%A472%E5%A4%A9%E6%8D%A2%E5%BC%A0%E8%84%B8/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%96%8F%E7%B1%B3%E8%8E%B2%E5%AD%90%E8%8A%B1%E7%94%9F%E6%B1%A472%E5%A4%A9%E6%8D%A2%E5%BC%A0%E8%84%B8/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%96%8F%E7%B1%B3%E8%8E%B2%E5%AD%90%E8%8A%B1%E7%94%9F%E6%B1%A472%E5%A4%A9%E6%8D%A2%E5%BC%A0%E8%84%B8/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%96%8F%E7%B1%B3%E8%8E%B2%E5%AD%90%E8%8A%B1%E7%94%9F%E6%B1%A472%E5%A4%A9%E6%8D%A2%E5%BC%A0%E8%84%B8/cover_3x4.png"], "text": "薏米莲子花生汤，72天换张脸\n\n✦ ✦ ✦\n\n💛 以前我一到换季脸就暗沉、起皮，粉底都卡纹。后来跟着懂食疗的朋友开始\"顺时喝汤\"，其中喝得最勤的就是这碗薏米莲子花生汤——不靠贵价补品，就是把当季祛湿养脾的食材炖成一碗。断断续续喝了两个多月（算下来快 72 天），同事问我是不是偷偷做了项目，气色肉眼可见亮了。\n\n✦ ✦ ✦\n\n🌿 方法一：【薏米·炒过才不寒】生薏米偏寒，直接喝反而伤脾。我买回薏米先干锅小火炒 8 分钟到微黄出香，再用来煲汤。每次抓 30 克，炒过的薏米祛湿不伤胃，喝完身体不沉、脸上也不容易浮那种\"泡水感\"的肿。⚠️ 坑：别图省事用生薏米直接煮，寒底的人越喝越虚。\n\n✦ ✦ ✦\n\n✨ 方法二：【莲子·去芯才安神】莲子养心安神，但莲子芯极苦还偏凉。我习惯买去芯莲子，每次 20 克，提前泡 30 分钟。和薏米同炖，晚上睡得踏实，熬夜后的蜡黄慢慢退下去——睡好了，脸自然就透。⚠️ 坑：带芯莲子苦到发涩，整碗汤的味儿都毁了。\n\n✦ ✦ ✦\n\n📌 方法三：【花生·认准红皮】润肤靠红皮花生，别用白白的水煮花生。红皮花生 30 克带皮一起炖，补血又润。我是连汤带花生一起吃，坚持一段，手背那种干到起皮的地方肉眼变软。⚠️ 坑：红皮遇水容易掉色，那是正常的，别当成\"染色\"扔了。\n\n✦ ✦ ✦\n\n💪 方法四：【一碗汤怎么煮】炒薏米 30 克、去芯莲子 20 克、红皮花生 30 克，花生莲子先泡 1 小时；所有材料入锅加约 1.2 升清水，大火煮开转小火 50 分钟，出锅前扔两粒红枣提味（不加糖也好喝）。我固定每周喝 3 次，当下午茶代替奶茶。⚠️ 坑：孕妇、经期女性、体质偏寒的人薏米减量；这碗汤是食养不是药，别指望三天变样。\n\n✦ ✦ ✦\n\n🥗 顺时喝汤说白了就是给身体一点\"对的食物\"。这碗汤我喝了快 72 天，最大的变化不是真的换脸，是素颜照镜子也敢开了。你最想改善哪方面？气色、睡眠还是祛湿？评论区聊聊，咱一起把日子喝出滋味。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#顺时养生 #食疗食养 #薏米莲子花生汤 #祛湿健脾 #养出好气色 #女生养生 #当季食材 #养生日常\n\n✦ ✦ ✦\n\n💡 免责声明：本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-14_跟着24节气吃脾胃舒服了", "account": "白哥的顺时食堂", "title": "跟着24节气吃脾胃舒服了", "category": "", "date": "2026-08-14", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-14 19:48", "publishedAt": null, "summary": "跟着24节气吃，脾胃舒服了 ✦ ✦ ✦ 💛 以前我一到换季就犯懵：春天犯困、夏天没胃口、秋天干咳、冬", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%B7%9F%E7%9D%8024%E8%8A%82%E6%B0%94%E5%90%83%E8%84%BE%E8%83%83%E8%88%92%E6%9C%8D%E4%BA%86/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%B7%9F%E7%9D%8024%E8%8A%82%E6%B0%94%E5%90%83%E8%84%BE%E8%83%83%E8%88%92%E6%9C%8D%E4%BA%86/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%B7%9F%E7%9D%8024%E8%8A%82%E6%B0%94%E5%90%83%E8%84%BE%E8%83%83%E8%88%92%E6%9C%8D%E4%BA%86/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%B7%9F%E7%9D%8024%E8%8A%82%E6%B0%94%E5%90%83%E8%84%BE%E8%83%83%E8%88%92%E6%9C%8D%E4%BA%86/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-14_%E8%B7%9F%E7%9D%8024%E8%8A%82%E6%B0%94%E5%90%83%E8%84%BE%E8%83%83%E8%88%92%E6%9C%8D%E4%BA%86/cover_3x4.png"], "text": "跟着24节气吃，脾胃舒服了\n\n✦ ✦ ✦\n\n💛 以前我一到换季就犯懵：春天犯困、夏天没胃口、秋天干咳、冬天手脚冰。后来跟着懂中医养生的朋友学\"顺时吃饭\"——不靠名贵补品，就按二十四节气切换食材，慢慢发现身体有了自己的节奏，换季不再像打仗。\n\n✦ ✦ ✦\n\n🌿 方法一：【立春·芽菜醒脾】立春前后多吃豆芽、香椿芽、豌豆苗这类\"活着的\"嫩芽，顺应肝气升发。我每周做 3 次清炒豆芽：绿豆芽 200 克洗净，沸水焯 30 秒捞出，大火快炒 1 分钟，出锅前撒 1 克海盐。连吃两周，早起嘴里那层黏腻感轻了，上午也不再昏昏沉沉。⚠️ 坑：香椿一定先焯水 1 分钟去亚硝酸盐，别图嫩直接凉拌。\n\n✦ ✦ ✦\n\n✨ 方法二：【夏至·苦味清心】夏至暑湿最重，我午餐固定加一盘凉拌苦瓜或一碗绿豆汤。苦瓜对半去瓤切薄片，冰水浸 10 分钟去涩，蘸少许蜂蜜；绿豆 100 克提前泡 2 小时，大火煮开转小火 40 分钟。下午那股心烦气躁像被浇了盆凉水，夜里也睡得沉。⚠️ 坑：苦瓜性寒，经期和脾胃虚的人浅尝辄止，别当饭吃。\n\n✦ ✦ ✦\n\n📌 方法三：【秋分·润燥养肺】秋燥最伤肺，我每天炖一盅银耳雪梨羹。银耳半朵冷水泡发 2 小时撕小朵，雪梨一个带皮切块，加两粒冰糖、三颗枸杞，隔水炖 1 小时。从秋分喝到霜降，嗓子不干了，早上起床不再咳两声。⚠️ 坑：梨别去皮，皮里润燥的成分最多；冰糖别贪多，两粒就够甜。\n\n✦ ✦ ✦\n\n💪 方法四：【冬至·温补藏阳】冬至起我每周喝 2 次羊肉姜汤。羊腿肉 300 克冷水下锅焯去血沫，加生姜 5 片、桂皮一小段、红枣 3 颗，小火炖 1.5 小时。喝完从胃暖到脚尖，往年冬天必冻裂的手现在红扑扑。⚠️ 坑：体质偏热、容易上火的人生姜减半，汤里别再加辣椒。\n\n✦ ✦ ✦\n\n🥗 顺时吃饭说白了就是把\"当季的、当地的\"放进一日三餐，不靠名贵补品。上面四个节气四个小方子，贵在坚持——我断断续续跟了快一年，换季不再像打仗。你最想从哪个季节开始试？评论区告诉我，咱一起把日子过得有滋有味。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#二十四节气 #顺时养生 #节气食谱 #食疗食养 #脾胃调理 #养生日常 #中医养生 #当季食材\n\n✦ ✦ ✦\n\n💡 免责声明：本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。\n"}];
const KEY='xhs_pub_state';
let items = DATA.map(function(e){return Object.assign({}, e);});
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
let manifestHandle=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
// 去掉 frontmatter，返回可发布的完整文案（标题+正文+标签+免责声明）
function stripFront(t){t=t||'';if(t.trim().indexOf('---')===0){var p=t.split('---',3);if(p.length>=3)return p[2];}return t;}
function copy(t){navigator.clipboard.writeText(t).then(function(){toast('✅ 已复制！');},function(){fallbackCopy(t);});}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('✅ 已复制！');}catch(e){toast('复制失败，请手动选择');}document.body.removeChild(ta);}
function toManifest(){return {items: items.map(function(e){return {id:e.id,account:e.account,title:e.title,summary:e.summary,images:e.images,recommendedTime:e.recommendedTime,status:e._status||e.status,createdAt:e.createdAt,publishedAt:e.publishedAt||null};});};}
async function writeManifest(){if(!manifestHandle)return false;try{const w=await manifestHandle.createWritable();await w.write(JSON.stringify(toManifest(),null,2));await w.close();return true;}catch(e){return false;}}
async function associate(){try{if(!window.showOpenFilePicker){toast('当前环境不支持直接写盘，请用「标记 X 已发布」指令');return;}const hs=await window.showOpenFilePicker({multiple:false,suggestedName:'manifest.json'});manifestHandle=hs[0];toast('✅ 已关联 manifest.json');}catch(e){toast('关联已取消或失败');}}
async function mark(id){
  const it=items.find(function(x){return x.id===id;});
  if(!it)return;
  it._status='已发布';it.publishedAt=new Date().toISOString();
  state[id]='已发布';save();
  const ok=await writeManifest();
  if(ok){toast('✅ 已标记已发布，manifest.json 已更新');}
  else{ // 复制 agent 指令兜底
    const cmd='标记 '+it.title+' 已发布';
    if(navigator.clipboard){navigator.clipboard.writeText(cmd).then(function(){toast('已复制指令：'+cmd+'（发给我即可同步到 manifest）');},function(){toast('请发送：'+cmd);});}
    else{toast('请发送：'+cmd);}
  }
  render();
}
document.getElementById('assocBtn').addEventListener('click',associate);
function render(){
  const app=document.getElementById('app');
  const groups={};
  items.forEach(function(e){e._status=state[e.id]||e.status;groups[e.account]=groups[e.account]||[];groups[e.account].push(e);});
  let html='';
  Object.keys(groups).forEach(function(acc){
    html+='<div class="acc-block"><div class="acc-title">'+acc+'</div><div class="cards">';
    groups[acc].forEach(function(e){
      const pub=(e._status==='已发布');
      const imgs=e.images.map(function(u){return '<img src="'+u+'" loading="lazy" onclick="window.open(''+u+'')">';}).join('');
      const full=stripFront(e.text);
      html+='<div class="card '+(pub?'pub':'')+'">'+
        '<span class="badge '+(pub?'pub':'draft')+'">'+(pub?'✅ 已发布':'⏳ 待发布')+'</span>'+
        '<h3>'+e.title+'</h3>'+
        '<div class="meta">分类：'+(e.category||'—')+'<br>推荐发布：<b>'+(e.recommendedTime||e.recommended_time)+'</b><br>生成时间：'+e.createdAt+(pub?('<br>发布时间：'+e.publishedAt):'')+'</div>'+
        '<div class="imgs">'+imgs+'</div>'+
        '<details><summary>📄 查看文案（点击展开）</summary><pre style="white-space:pre-wrap;font-size:12px;line-height:1.6;">'+full.replace(/</g,'&lt;')+'</pre></details>'+
        '<button class="copy-btn" onclick="copy(`'+full.replace(/`/g,'\`')+'`)">📋 复制文案</button>'+
        (pub?'':'<button class="pub-btn" onclick="mark(`'+e.id+'`)">✅ 标记已发布</button>')+
        '</div>';
    });
    html+='</div></div>';
  });
  app.innerHTML=html;
}
render();
