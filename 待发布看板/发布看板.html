眼球、缓解干涩；远眺能放松睫状肌，预防近视加深。茶水间走一趟的功夫，就把眼睛养了。\n\n✦ ✦ ✦\n\n🚶 【每日6000步】碎步走也有效，气血流通最重要\n\n名中医孙国杰每天走6000步，不是暴走，是碎步——在家来回走、上楼下楼、去茶水间都算。中医讲「气血流通，经络通畅」，久坐则气血瘀滞，微汗即止，不必大汗淋漓。\n\n✦ ✦ ✦\n\n💬 互动时间：你今天做了几组五官操？评论区打卡，互相监督坚持30天。\n\n🏷️ #五官操 #名中医养生 #不跑不跳养五脏 #办公室养生 #叩齿吞津 #中医保健 #碎片时间养生 #打工人健康 #日常养生操 #穴位按摩\n\n⚠️ 免责声明：本内容仅供日常养生参考，不能替代医疗诊断与治疗。如有不适，请及时就医。\n"}, {"id": "2026-08-26_全年养肺黄金期立秋三防五养全攻略", "account": "白哥的顺时食堂", "title": "立秋养肺黄金期，三防五养全攻略，错过等一年", "category": "", "date": "2026-08-26", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-26 20:36", "publishedAt": null, "summary": "立秋养肺黄金期，三防五养全攻略，错过等一年 💤 立秋一到，很多人以为秋天来了就能凉快，但你知道吗？立", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%85%A8%E5%B9%B4%E5%85%BB%E8%82%BA%E9%BB%84%E9%87%91%E6%9C%9F%E7%AB%8B%E7%A7%8B%E4%B8%89%E9%98%B2%E4%BA%94%E5%85%BB%E5%85%A8%E6%94%BB%E7%95%A5/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%85%A8%E5%B9%B4%E5%85%BB%E8%82%BA%E9%BB%84%E9%87%91%E6%9C%9F%E7%AB%8B%E7%A7%8B%E4%B8%89%E9%98%B2%E4%BA%94%E5%85%BB%E5%85%A8%E6%94%BB%E7%95%A5/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%85%A8%E5%B9%B4%E5%85%BB%E8%82%BA%E9%BB%84%E9%87%91%E6%9C%9F%E7%AB%8B%E7%A7%8B%E4%B8%89%E9%98%B2%E4%BA%94%E5%85%BB%E5%85%A8%E6%94%BB%E7%95%A5/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%85%A8%E5%B9%B4%E5%85%BB%E8%82%BA%E9%BB%84%E9%87%91%E6%9C%9F%E7%AB%8B%E7%A7%8B%E4%B8%89%E9%98%B2%E4%BA%94%E5%85%BB%E5%85%A8%E6%94%BB%E7%95%A5/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%85%A8%E5%B9%B4%E5%85%BB%E8%82%BA%E9%BB%84%E9%87%91%E6%9C%9F%E7%AB%8B%E7%A7%8B%E4%B8%89%E9%98%B2%E4%BA%94%E5%85%BB%E5%85%A8%E6%94%BB%E7%95%A5/body_5.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%85%A8%E5%B9%B4%E5%85%BB%E8%82%BA%E9%BB%84%E9%87%91%E6%9C%9F%E7%AB%8B%E7%A7%8B%E4%B8%89%E9%98%B2%E4%BA%94%E5%85%BB%E5%85%A8%E6%94%BB%E7%95%A5/body_6.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%85%A8%E5%B9%B4%E5%85%BB%E8%82%BA%E9%BB%84%E9%87%91%E6%9C%9F%E7%AB%8B%E7%A7%8B%E4%B8%89%E9%98%B2%E4%BA%94%E5%85%BB%E5%85%A8%E6%94%BB%E7%95%A5/cover_3x4.png"], "text": "立秋养肺黄金期，三防五养全攻略，错过等一年\n\n💤 立秋一到，很多人以为秋天来了就能凉快，但你知道吗？立秋其实是全年养肺的黄金窗口期。中医说「秋气通于肺」，这时候把肺养好，秋冬少生病。\n\n✦ ✦ ✦\n\n🫁 【防燥润肺】吃对白色食材，嗓子不干鼻子通\n\n秋季燥邪当令，肺最易受伤。口干舌燥、嗓子干痒、鼻子干、皮肤痒，都是秋燥信号。记住四个字：「燥则润之」，多吃白色食物——百合、银耳、莲子、雪梨、南瓜，养阴润肺，津液不亏。每天喝一杯银耳百合羹，比涂什么保湿霜都管用。\n\n✦ ✦ ✦\n\n🍋 【防散敛肺】少吃辛辣多吃酸，肺气不耗不上火\n\n秋季养生宜「收」不宜「散」。辛辣的葱姜蒜韭会助长肺气，吃多了容易上火、便秘、咽喉痛。换成酸味食物——橘子、柠檬、石榴、乌梅、葡萄，酸能收敛肺气，让人静心安神。处暑后这招特别管用。\n\n✦ ✦ ✦\n\n🧥 【防寒护阳】空调别直吹，颈背脚踝要保暖\n\n「立秋一日，水冷三分。」早晚凉意渐生，但中午还热，这叫「秋老虎」。空调别开太低，尤其别直吹脖子、后背、脚踝——这些地方血管丰富，受寒容易感冒、肩颈痛。睡觉时护好肚脐和后背，别贪凉。\n\n✦ ✦ ✦\n\n🌙 【早睡早起】顺应秋收，养阴敛阳\n\n《黄帝内经》说：「秋三月，早卧早起，与鸡俱兴。」早睡养阴，早起舒肺。建议22:30前入睡，不熬夜耗阴。清晨阳台站5分钟，深呼吸，让肺气舒展。\n\n✦ ✦ ✦\n\n😌 【精神调养】使志安宁，收敛神气\n\n秋天容易情绪低落，这是「悲秋」体质在作祟。《内经》讲「收敛神气，使秋气平」，意思是让心神安静下来。别想太多，别纠结过去，做点让人平静的事——散步、听轻音乐、泡杯菊花茶。\n\n✦ ✦ ✦\n\n🍵 【茶饮方】桑菊润燥饮，一口清肺\n\n桑叶5克、菊花5克、麦冬10克、冰糖少许，开水冲泡代茶饮。桑叶清肺润燥，菊花疏散风热，麦冬养阴生津。每天一杯，嗓子舒服，皮肤不干。\n\n✦ ✦ ✦\n\n💬 互动时间：你立秋后最容易哪里不舒服？嗓子干、皮肤痒、还是睡不好？评论区说说，下期出对症调理方案。\n\n🏷️ #立秋养生 #养肺黄金期 #三防五养 #处暑养生 #秋季润燥 #中医养生 #节气食养 #养生日常 #健康生活方式 #换季保养\n\n⚠️ 免责声明：本内容仅供日常养生参考，不能替代医疗诊断与治疗。如有不适，请及时就医。\n"}, {"id": "2026-08-26_别再以肉贴膘换季均衡营养", "account": "白哥的顺时食堂", "title": "处暑后别再大鱼大肉贴秋膘，这样吃才不胖不上火", "category": "", "date": "2026-08-26", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-26 20:26", "publishedAt": null, "summary": "处暑后别再大鱼大肉贴秋膘，这样吃才不胖不上火 🍂 处暑已过，三伏结束，民间习惯「贴秋膘」——红烧肉、", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%88%AB%E5%86%8D%E4%BB%A5%E8%82%89%E8%B4%B4%E8%86%98%E6%8D%A2%E5%AD%A3%E5%9D%87%E8%A1%A1%E8%90%A5%E5%85%BB/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%88%AB%E5%86%8D%E4%BB%A5%E8%82%89%E8%B4%B4%E8%86%98%E6%8D%A2%E5%AD%A3%E5%9D%87%E8%A1%A1%E8%90%A5%E5%85%BB/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%88%AB%E5%86%8D%E4%BB%A5%E8%82%89%E8%B4%B4%E8%86%98%E6%8D%A2%E5%AD%A3%E5%9D%87%E8%A1%A1%E8%90%A5%E5%85%BB/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%88%AB%E5%86%8D%E4%BB%A5%E8%82%89%E8%B4%B4%E8%86%98%E6%8D%A2%E5%AD%A3%E5%9D%87%E8%A1%A1%E8%90%A5%E5%85%BB/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%88%AB%E5%86%8D%E4%BB%A5%E8%82%89%E8%B4%B4%E8%86%98%E6%8D%A2%E5%AD%A3%E5%9D%87%E8%A1%A1%E8%90%A5%E5%85%BB/cover_3x4.png"], "text": "处暑后别再大鱼大肉贴秋膘，这样吃才不胖不上火\n\n🍂 处暑已过，三伏结束，民间习惯「贴秋膘」——红烧肉、炖肘子、涮羊肉轮番上阵。但你可能不知道：现代人根本不需要囤脂肪御寒。肥胖、三高、久坐少动，才是今天的常态。一味以肉贴膘，反而给脾胃添负担。\n\n✦ ✦ ✦\n\n🥩 【优质蛋白优先】深海鱼禽肉豆，补而不腻\n\n古人贴秋膘是因为体力消耗大、需要热量过冬。今天空调暖气齐全，久坐办公，根本用不着囤脂。换成优质蛋白——深海鱼（富含Omega-3）、鸡鸭肉（脂肪低）、豆制品、蛋奶，补营养不补脂肪，体重不涨。\n\n✦ ✦ ✦\n\n🥗 【时令蔬果跟上】山药莲藕秋梨，润燥又饱腹\n\n秋天根茎类食材正上市——山药健脾、莲藕润燥、红薯补纤维。搭配当季水果：梨润肺、石榴收敛、葡萄补气血。这些食物体积大、热量低、饱腹感强，比一碗红烧肉管用多了。\n\n✦ ✦ ✦\n\n🚫 【三类人慎贴膘】糖尿病高血脂高尿酸，别乱补\n\n不是所有人都适合传统贴秋膘。BMI超28、糖尿病、高血脂、高尿酸人群，盲目进补会加重代谢负担。糖尿病选低GI食物，高血脂控脂肪钠盐，高尿酸避动物内脏浓肉汤。补营养不等于补脂肪。\n\n✦ ✦ ✦\n\n🥣 【一碗山药莲子粥】健脾润燥，老少皆宜\n\n铁棍山药300克、莲子15克、芡实15克、红枣15克，加水熬粥。山药健脾养胃，莲子清心安神，芡实祛湿，红枣补气。早餐一碗，脾胃舒服，整个人不困不乏。\n\n✦ ✦ ✦\n\n💬 互动时间：你家贴秋膘吃什么？红烧肉还是换个花样？评论区晒晒你的秋日餐桌。\n\n🏷️ #贴秋膘 #处暑养生 #均衡营养 #秋季食养 #健脾润燥 #健康饮食 #中医食疗 #养生食谱 #节气养生 #少肉多蔬\n\n⚠️ 免责声明：本内容仅供日常养生参考，不能替代医疗诊断与治疗。如有基础疾病，请遵医嘱调整饮食。\n"}, {"id": "2026-08-26_工位三式八段锦肩颈松了", "account": "白领阿白自救记", "title": "工位三式八段锦，肩颈松了", "category": "", "date": "2026-08-26", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-26 07:35", "publishedAt": null, "summary": "工位三式八段锦，肩颈松了 ✦ ✦ ✦ 💺 又是坐了一整天的打工人举个手。下午三点脖子转不动、腰像断了", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%B7%A5%E4%BD%8D%E4%B8%89%E5%BC%8F%E5%85%AB%E6%AE%B5%E9%94%A6%E8%82%A9%E9%A2%88%E6%9D%BE%E4%BA%86/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%B7%A5%E4%BD%8D%E4%B8%89%E5%BC%8F%E5%85%AB%E6%AE%B5%E9%94%A6%E8%82%A9%E9%A2%88%E6%9D%BE%E4%BA%86/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%B7%A5%E4%BD%8D%E4%B8%89%E5%BC%8F%E5%85%AB%E6%AE%B5%E9%94%A6%E8%82%A9%E9%A2%88%E6%9D%BE%E4%BA%86/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E5%B7%A5%E4%BD%8D%E4%B8%89%E5%BC%8F%E5%85%AB%E6%AE%B5%E9%94%A6%E8%82%A9%E9%A2%88%E6%9D%BE%E4%BA%86/cover_3x4.png"], "text": "工位三式八段锦，肩颈松了\n\n✦ ✦ ✦\n\n💺 又是坐了一整天的打工人举个手。下午三点脖子转不动、腰像断了一样、腿还发胀——别等身体报警才动。八段锦不是大爷专利，我在工位上偷偷练这三式，零成本、不流汗，同事还以为我在认真打字。肩颈松了，下班整个人是轻的。\n\n✦ ✦ ✦\n\n🤲 【托天理三焦】双手交叉翻掌，慢慢向上托过头顶，抬头看手背，停留3秒再缓缓落下，做6遍。这一式把整条脊柱拉开，久坐卡住的肩颈瞬间通气，像给上半身做了次拉伸复位。\n\n✦ ✦ ✦\n\n💺 【摇头摆尾】坐稳只动上半身，缓慢向左转腰、头随肩慢慢摆，再换右边，左右各8次。把腰上那股闷火顺出去，缓解久坐腰酸，切记别猛扭，动作越慢越松。\n\n✦ ✦ ✦\n\n🦵 【背后七颠】站起双脚并拢，脚跟缓缓踮起再轻轻落下，颠7下为一组，做3组。靠小腿起落带动气血，疏通下肢、消久坐腿胀，等电梯或接水时就能颠。\n\n✦ ✦ ✦\n\n💬 每坐40分钟就挑一式练1分钟，一天攒下来比周末猛练两小时还顶用。你最僵的是脖子还是腰？评论区说说，下次专写你最痛的那块。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#工位养生 #久坐自救 #八段锦 #肩颈放松 #打工人养生 #办公室微运动 #碎片化运动 #护腰护颈 #零成本养生 #健康打工\n\n✦ ✦ ✦\n\n⚠️ 免责声明：本文为办公室养生与久坐自救分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有严重身体不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-26_焦虑是信号不是敌人3步松绑", "account": "小白在睡觉", "title": "焦虑是信号不是敌人·3步松绑", "category": "", "date": "2026-08-26", "status": "待发布", "recommended_time": "今晚21:00", "best_window": "21:00（睡前情绪共鸣时段）", "recommendedTime": "21:00", "compliance": "—", "publish_time": "", "createdAt": "2026-08-26 09:33", "publishedAt": null, "summary": "焦虑是信号不是敌人·3步松绑 ✦ ✦ ✦ 💛 凌晨两点又醒了，脑子里像放电影：明天的汇报、没回的消息", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E7%84%A6%E8%99%91%E6%98%AF%E4%BF%A1%E5%8F%B7%E4%B8%8D%E6%98%AF%E6%95%8C%E4%BA%BA3%E6%AD%A5%E6%9D%BE%E7%BB%91/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E7%84%A6%E8%99%91%E6%98%AF%E4%BF%A1%E5%8F%B7%E4%B8%8D%E6%98%AF%E6%95%8C%E4%BA%BA3%E6%AD%A5%E6%9D%BE%E7%BB%91/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E7%84%A6%E8%99%91%E6%98%AF%E4%BF%A1%E5%8F%B7%E4%B8%8D%E6%98%AF%E6%95%8C%E4%BA%BA3%E6%AD%A5%E6%9D%BE%E7%BB%91/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E7%84%A6%E8%99%91%E6%98%AF%E4%BF%A1%E5%8F%B7%E4%B8%8D%E6%98%AF%E6%95%8C%E4%BA%BA3%E6%AD%A5%E6%9D%BE%E7%BB%91/cover_3x4.png"], "text": "焦虑是信号不是敌人·3步松绑\n\n✦ ✦ ✦\n\n💛 凌晨两点又醒了，脑子里像放电影：明天的汇报、没回的消息、三年前的尴尬事。越告诉自己\"别想了\"，越清醒。后来才懂，焦虑不是来害我的，它在提醒我哪块绷太紧了。\n\n✦ ✦ ✦\n\n🌿 【把焦虑当信使】下次心慌别急着压，先问一句\"它在提醒我什么\"。我试了两周，把冒出来的念头写在一张纸上，写完八成发现是瞎操心，心反而松了。记下就放下，比硬扛省一半力气，睡前也不再反复想。\n\n✦ ✦ ✦\n\n✨ 【给大脑设\"发愁时段\"】每天傍晚固定留15分钟专门发愁，其他时间念头冒出来，就对自己说\"留到三点半\"。亲测一周，睡前翻来覆去的次数从5次降到1次，脑子学会了到点才开工，躺下不再自动播放烦恼。\n\n✦ ✦ ✦\n\n📌 【身体先松脑子才松】焦虑上来先管身体：4-7-8呼吸（吸气4秒、屏息7秒、呼气8秒）做4组，再转三圈肩颈。一般3分钟就能把砰砰跳的心率拉回平稳，比刷手机空想管用得多，也更好入睡。\n\n✦ ✦ ✦\n\n💪 焦虑不是敌人，是身体在敲门的信号。三步试试：写下来、定时愁、先松身。你最近一次被焦虑半夜叫醒，是因为啥？评论区说说，下回挑典型的写怎么接住。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#焦虑自救 #情绪稳定 #睡前焦虑 #失眠自救 #停止内耗 #自我和解 #打工人心理 #小白在睡觉 #学会适当焦虑 #爱自己\n\n✦ ✦ ✦\n\n💡 免责声明：本文为睡眠成分科普与生活分享，内容仅供参考，不替代专业医疗诊断与治疗。如有长期失眠或身体不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-26_自制泡菜注意这几点", "account": "白哥的顺时食堂", "title": "自制泡菜,注意这几点", "category": "", "date": "2026-08-26", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-26 09:41", "publishedAt": null, "summary": "自制泡菜,注意这几点 ✦ ✦ ✦ 🥬 自己泡的泡菜干净又下饭，但每年都有人中招——长白沫、发软、甚至", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E8%87%AA%E5%88%B6%E6%B3%A1%E8%8F%9C%E6%B3%A8%E6%84%8F%E8%BF%99%E5%87%A0%E7%82%B9/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E8%87%AA%E5%88%B6%E6%B3%A1%E8%8F%9C%E6%B3%A8%E6%84%8F%E8%BF%99%E5%87%A0%E7%82%B9/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E8%87%AA%E5%88%B6%E6%B3%A1%E8%8F%9C%E6%B3%A8%E6%84%8F%E8%BF%99%E5%87%A0%E7%82%B9/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E8%87%AA%E5%88%B6%E6%B3%A1%E8%8F%9C%E6%B3%A8%E6%84%8F%E8%BF%99%E5%87%A0%E7%82%B9/cover_3x4.png"], "text": "自制泡菜,注意这几点\n\n✦ ✦ ✦\n\n🥬 自己泡的泡菜干净又下饭，但每年都有人中招——长白沫、发软、甚至吃坏肚子。其实泡菜翻车，多半是前面几步没卡住。我泡了几年坛子，把最容易踩的坑给你拎出来，照着做基本零失败。\n\n✦ ✦ ✦\n\n🫙 【容器要干净无油】玻璃坛或密封罐，先用开水烫一遍、彻底晾干，全程不能沾生水和油。一根带油的筷子进去，整坛杂菌就疯长。装菜前手和工具都擦干，这是不坏的底子。\n\n✦ ✦ ✦\n\n🧂 【盐度要够别手软】清水配盐大概 5%（1000ml 水放 50g 盐），盐不够菜容易软烂、起白沫。水里加两瓣蒜、几粒花椒或一小勺高度白酒，既能压异味又能抑菌，泡出来更脆更香。\n\n✦ ✦ ✦\n\n🌿 【避光密封，避开高峰再吃】封好放阴凉避光处慢慢发酵。重点：头 7–15 天亚硝酸盐最高，千万别急着尝。等 20 天以后亚硝酸盐落下去再开坛，口感脆、吃着也踏实。\n\n✦ ✦ ✦\n\n💬 你在家泡菜踩过最惨的坑是啥？长白沫还是发软？评论区聊聊，下回专写避坑那块。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#自制泡菜 #发酵食物 #顺时食养 #厨房干货 #白哥的顺时食堂 #零失败食谱 #食物安全 #家常小菜 #下饭神器 #慢生活\n\n✦ ✦ ✦\n\n💡 免责声明：本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-26_视力越来越差7个科学护眼法", "account": "白领阿白自救记", "title": "视力越来越差 7个科学护眼法", "category": "", "date": "2026-08-26", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-26 08:04", "publishedAt": null, "summary": "视力越来越差 7个科学护眼法 ✦ ✦ ✦ 👀 盯屏8小时后眼睛干涩、看字发虚、头还隐隐作痛？别等验光", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E8%A7%86%E5%8A%9B%E8%B6%8A%E6%9D%A5%E8%B6%8A%E5%B7%AE7%E4%B8%AA%E7%A7%91%E5%AD%A6%E6%8A%A4%E7%9C%BC%E6%B3%95/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E8%A7%86%E5%8A%9B%E8%B6%8A%E6%9D%A5%E8%B6%8A%E5%B7%AE7%E4%B8%AA%E7%A7%91%E5%AD%A6%E6%8A%A4%E7%9C%BC%E6%B3%95/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E8%A7%86%E5%8A%9B%E8%B6%8A%E6%9D%A5%E8%B6%8A%E5%B7%AE7%E4%B8%AA%E7%A7%91%E5%AD%A6%E6%8A%A4%E7%9C%BC%E6%B3%95/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-26_%E8%A7%86%E5%8A%9B%E8%B6%8A%E6%9D%A5%E8%B6%8A%E5%B7%AE7%E4%B8%AA%E7%A7%91%E5%AD%A6%E6%8A%A4%E7%9C%BC%E6%B3%95/cover_3x4.png"], "text": "视力越来越差 7个科学护眼法\n\n✦ ✦ ✦\n\n👀 盯屏8小时后眼睛干涩、看字发虚、头还隐隐作痛？别等验光度数又涨才管。护眼不用买一堆仪器，先把最科学的几招拆进工作里。今天先给你打工人最该做的3个——不花钱、不离开工位、同事看不出你在护眼。\n\n✦ ✦ ✦\n\n⏰ 【20-20-20法则】每看屏20分钟，抬头看20英尺（约6米）外的远处，停留20秒。给睫状肌一个放松的停顿，缓解调节痉挛、延缓近视加深。设个闹钟，接水时顺势远眺最自然。\n\n✦ ✦ ✦\n\n👁️ 【主动眨眼操】盯屏时人会自动\"忘了眨眼睛\"，泪膜干了就涩。刻意每10秒做一次完整眨眼：轻闭、停1秒、再睁眼，一天攒几百次。把泪液均匀铺在眼球上，比滴眼药更治本，开会时也能偷做。\n\n✦ ✦ ✦\n\n💆 【午休闭眼+蒸汽眼罩】午饭别刷手机，趴着不如闭眼10分钟；下午眼睛胀就贴片蒸汽眼罩热敷5分钟，促进眼周循环。给眼睛真正的\"关机\"时间，比一直熬着强太多。\n\n✦ ✦ ✦\n\n💬 你现在一天大概看屏几小时？眼睛最难受是干涩还是胀痛？评论区说说，下次专写你最痛的那块。\n\n✦ ✦ ✦\n\n🏷️ 话题标签：#护眼 #打工人养生 #20-20-20法则 #干眼症 #久坐自救 #办公室微运动 #视力保护 #熬夜护眼 #健康打工 #碎片化养生\n\n✦ ✦ ✦\n\n⚠️ 免责声明：本文为办公室护眼与久坐自救分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有持续眼痛、视力骤降等不适，请前往正规医疗机构眼科就诊。\n"}, {"id": "2026-08-27_工位肩颈自救脖子硬得像石板4个动作立刻松", "account": "白领阿白自救记", "title": "工位肩颈自救｜脖子硬得像石板？4个动作立刻松", "category": "", "date": "2026-08-27", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-27 07:40", "publishedAt": null, "summary": "工位肩颈自救｜脖子硬得像石板？4个动作立刻松 早上还好好的，到下午脖子就僵得转不动，肩膀沉得像扛了两", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E5%B7%A5%E4%BD%8D%E8%82%A9%E9%A2%88%E8%87%AA%E6%95%91%E8%84%96%E5%AD%90%E7%A1%AC%E5%BE%97%E5%83%8F%E7%9F%B3%E6%9D%BF4%E4%B8%AA%E5%8A%A8%E4%BD%9C%E7%AB%8B%E5%88%BB%E6%9D%BE/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E5%B7%A5%E4%BD%8D%E8%82%A9%E9%A2%88%E8%87%AA%E6%95%91%E8%84%96%E5%AD%90%E7%A1%AC%E5%BE%97%E5%83%8F%E7%9F%B3%E6%9D%BF4%E4%B8%AA%E5%8A%A8%E4%BD%9C%E7%AB%8B%E5%88%BB%E6%9D%BE/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E5%B7%A5%E4%BD%8D%E8%82%A9%E9%A2%88%E8%87%AA%E6%95%91%E8%84%96%E5%AD%90%E7%A1%AC%E5%BE%97%E5%83%8F%E7%9F%B3%E6%9D%BF4%E4%B8%AA%E5%8A%A8%E4%BD%9C%E7%AB%8B%E5%88%BB%E6%9D%BE/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E5%B7%A5%E4%BD%8D%E8%82%A9%E9%A2%88%E8%87%AA%E6%95%91%E8%84%96%E5%AD%90%E7%A1%AC%E5%BE%97%E5%83%8F%E7%9F%B3%E6%9D%BF4%E4%B8%AA%E5%8A%A8%E4%BD%9C%E7%AB%8B%E5%88%BB%E6%9D%BE/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E5%B7%A5%E4%BD%8D%E8%82%A9%E9%A2%88%E8%87%AA%E6%95%91%E8%84%96%E5%AD%90%E7%A1%AC%E5%BE%97%E5%83%8F%E7%9F%B3%E6%9D%BF4%E4%B8%AA%E5%8A%A8%E4%BD%9C%E7%AB%8B%E5%88%BB%E6%9D%BE/cover_3x4.png"], "text": "工位肩颈自救｜脖子硬得像石板？4个动作立刻松\n\n早上还好好的，到下午脖子就僵得转不动，肩膀沉得像扛了两袋米。久坐8小时的打工人，肩颈早就不是自己的了。\n\n✦ ✦ ✦\n\n💡 肩颈僵硬不是「累了歇歇就好」的小事，而是肌肉长期紧张导致的慢性劳损。越拖越僵，越僵越痛。今天分享4个在工位就能做的动作，不占地、不显眼，摸鱼的功夫就能练。\n\n✦ ✦ ✦\n\n🧘 动作一：【耸肩沉肩循环】耸肩沉肩循环（1分钟）\n坐姿端正，双肩用力向上耸到耳朵旁边，停3秒，然后用力向下沉，彻底放松。重复10-15次。这个动作通过一紧一松的节奏，快速促进肩颈血液循环，缓解肌肉僵硬。开会、听汇报时都能偷偷做。\n\n小提醒：耸的时候用点力，沉的时候彻底放松，节奏慢一点效果更好。\n\n✦ ✦ ✦\n\n🧘 动作二：【收下巴点头】收下巴点头（30秒）\n不是猛地点头，而是把下巴往胸口方向收，感受后颈被轻轻拉开，停2秒再回到原位。做5次。这个动作能纠正头前伸的体态，减轻颈椎压力。\n\n小提醒：动作幅度不用大，坐在电脑后面谁都看不见。\n\n✦ ✦ ✦\n\n🧘 动作三：【侧颈拉伸】侧颈拉伸（每侧30秒）\n自然坐直，头慢慢向一侧肩膀靠，到侧面有牵拉感就停，保持3次呼吸，换边。注意：别用手使劲扳头！轻轻带力，舒服就行。\n\n小提醒：很多人拉伸就死命扳，反而伤到颈椎。有酸胀感不疼就是合适力度。\n\n✦ ✦ ✦\n\n🧘 动作四：【开胸展肩】开胸展肩（10次）\n双手交叉放到后脑勺，慢慢把手肘往两边打开，感受胸口和肩前侧被拉开，再慢慢收回。做8-10次。天天含胸敲键盘的人，做完这个立刻感觉「胸口敞亮了」。\n\n小提醒：这个动作专门对抗圆肩驼背，长期坚持能改善体态。\n\n✦ ✦ ✦\n\n⚠️ 温馨提示：每个动作做到微酸即可，别追求疼痛。建议每坐1小时起来活动5分钟，比一次做半小时更有效。如果肩颈疼痛伴随手麻、头晕，请及时就医。\n"}, {"id": "2026-08-27_睡前仪式助眠躺下两小时还清醒我的睡前10分钟仪式救了我", "account": "小白在睡觉", "title": "睡前仪式助眠｜躺下两小时还清醒？我的睡前10分钟仪式救了我", "category": "", "date": "2026-08-27", "status": "待发布", "recommended_time": "今晚21:00", "best_window": "21:00（睡前情绪共鸣时段）", "recommendedTime": "21:00", "compliance": "—", \n\n🌙 我的睡前10分钟仪式（亲测有效，坚持两周入睡时间从60分钟缩到20分钟）：\n\n第一步：【温水泡脚】温水泡脚10分钟\n水温40℃左右，泡到微微出汗即可。足底有丰富的神经末梢，温热刺激能激活副交感神经，向大脑传递「该放松了」的信号。如果没时间泡脚，至少用热毛巾敷脚5分钟，同样有效。\n\n第二步：【揉腹36圈】揉腹36圈\n平躺，双手搓热，以肚脐为中心顺时针轻揉。饭后1小时内别做。久坐、喝水少、蔬菜吃得少的人，揉腹能促进肠道蠕动，缓解腹胀，让身体更舒服地进入睡眠状态。\n\n第三步：【478呼吸法】478呼吸法\n吸气4秒，屏息7秒，呼气8秒。重复4-5轮。这个呼吸节奏能强制降低心率，让过度活跃的交感神经「刹车」。刚开始可能觉得憋气不舒服，坚持3天就能适应。\n\n第四步：【听轻音乐】远离手机，听轻音乐或有声书\n蓝光会抑制褪黑素分泌，睡前1小时放下电子设备。换成白噪音、自然声音或舒缓的有声内容，让注意力从「想事情」转移到「听内容」，大脑就不会反复回放白天的焦虑。\n\n✦ ✦ ✦\n\n⚠️ 温馨提示：睡前仪式是习惯养成，不是速效药。前3天可能效果不明显，坚持1-2周才能看到稳定改善。如果失眠持续超过3个月或伴随头痛胸闷，请及时就医排查。\n"}, {"id": "2026-08-27_苹果水食养饭后胀气犯困这杯养生水比奶茶管用", "account": "白哥的顺时食堂", "title": "苹果水食养｜饭后胀气犯困？这杯养生水比奶茶管用", "category": "", "date": "2026-08-27", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-27 07:40", "publishedAt": null, "summary": "苹果水食养｜饭后胀气犯困？这杯养生水比奶茶管用 吃完午饭胃里胀胀的，下午犯困没精神，奶茶越喝越渴。其", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E8%8B%B9%E6%9E%9C%E6%B0%B4%E9%A3%9F%E5%85%BB%E9%A5%AD%E5%90%8E%E8%83%80%E6%B0%94%E7%8A%AF%E5%9B%B0%E8%BF%99%E6%9D%AF%E5%85%BB%E7%94%9F%E6%B0%B4%E6%AF%94%E5%A5%B6%E8%8C%B6%E7%AE%A1%E7%94%A8/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E8%8B%B9%E6%9E%9C%E6%B0%B4%E9%A3%9F%E5%85%BB%E9%A5%AD%E5%90%8E%E8%83%80%E6%B0%94%E7%8A%AF%E5%9B%B0%E8%BF%99%E6%9D%AF%E5%85%BB%E7%94%9F%E6%B0%B4%E6%AF%94%E5%A5%B6%E8%8C%B6%E7%AE%A1%E7%94%A8/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E8%8B%B9%E6%9E%9C%E6%B0%B4%E9%A3%9F%E5%85%BB%E9%A5%AD%E5%90%8E%E8%83%80%E6%B0%94%E7%8A%AF%E5%9B%B0%E8%BF%99%E6%9D%AF%E5%85%BB%E7%94%9F%E6%B0%B4%E6%AF%94%E5%A5%B6%E8%8C%B6%E7%AE%A1%E7%94%A8/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E8%8B%B9%E6%9E%9C%E6%B0%B4%E9%A3%9F%E5%85%BB%E9%A5%AD%E5%90%8E%E8%83%80%E6%B0%94%E7%8A%AF%E5%9B%B0%E8%BF%99%E6%9D%AF%E5%85%BB%E7%94%9F%E6%B0%B4%E6%AF%94%E5%A5%B6%E8%8C%B6%E7%AE%A1%E7%94%A8/body_4.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-27_%E8%8B%B9%E6%9E%9C%E6%B0%B4%E9%A3%9F%E5%85%BB%E9%A5%AD%E5%90%8E%E8%83%80%E6%B0%94%E7%8A%AF%E5%9B%B0%E8%BF%99%E6%9D%AF%E5%85%BB%E7%94%9F%E6%B0%B4%E6%AF%94%E5%A5%B6%E8%8C%B6%E7%AE%A1%E7%94%A8/cover_3x4.png"], "text": "苹果水食养｜饭后胀气犯困？这杯养生水比奶茶管用\n\n吃完午饭胃里胀胀的，下午犯困没精神，奶茶越喝越渴。其实有一杯东西比奶茶管用，成本不到3块钱，煮15分钟就能喝。\n\n✦ ✦ ✦\n\n💡 苹果水的核心逻辑不是「排毒」，而是用温和的方式帮助消化、减少油腻感、补充水分。饭后一杯，比继续喝冰奶茶对胃更友好。\n\n✦ ✦ ✦\n\n🍎 【苹果水的配方】苹果水配方（1人份）：\n• 苹果 1个（红富士最好，带皮切块）\n• 山楂 5-6颗\n• 陈皮 1小片\n• 枸杞 10粒\n• 清水 500ml\n\n✦ ✦ ✦\n\n🍎 【苹果水的做法】做法：\n苹果洗净带皮切块（果皮富含膳食纤维和果胶，别削皮）。锅里倒500ml清水，放入苹果、山楂、陈皮，水开后转小火煮15分钟。快关火前5分钟再放枸杞。喜欢甜可以加一小块冰糖，但不建议多放。温热后喝，每天1杯就够了。\n\n⚠️ 注意：胃酸多、反酸明显的人，山楂少放；空腹别喝；饭后1小时内喝最好。\n\n✦ ✦ ✦\n\n🍎 【什么时候喝最合适】什么时候喝最合适？\n• 午饭吃得偏油时 → 替代奶茶，减少油腻感\n• 下午犯困、嘴里发黏时 → 比咖啡温和，不伤胃\n• 久坐一天胃口不顺时 → 温水+果酸，帮助消化\n\n✦ ✦ ✦\n\n🍎 【苹果水的三个隐藏好处】苹果水的三个隐藏好处：\n1️⃣ 补水不升糖：比含糖饮料健康，比白开水好喝\n2️⃣ 山楂消食：助消化，缓解饭后腹胀\n3️⃣ 陈皮理气：缓解胃胀气，让肚子更舒服\n\n喝了一周后，午饭后的胀气和犯困明显改善，下午精神好多了。\n\n✦ ✦ ✦\n\n⚠️ 温馨提示：苹果水是食疗不是药，不能替代正规治疗。血糖控制不好的人注意红枣和苹果的甜度计算进当天饮食。经期不适严重请就医排查。\n"}, {"id": "2026-08-28_每坐40分钟动1次", "account": "白领阿白自救记", "title": "每坐40分钟动1次，比补品实在", "category": "", "date": "2026-08-28", "status": "待发布", "recommended_time": "早上08:30", "best_window": "08:30（上班途中）", "recommendedTime": "08:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-28T09:43:21+0800", "publishedAt": null, "summary": "每坐40分钟动1次，比补品实在 ✦ ✦ ✦ 💛 打工人懂的都懂：一坐就是大半天，下班腰像断了一样，小", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E6%AF%8F%E5%9D%9040%E5%88%86%E9%92%9F%E5%8A%A81%E6%AC%A1/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E6%AF%8F%E5%9D%9040%E5%88%86%E9%92%9F%E5%8A%A81%E6%AC%A1/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E6%AF%8F%E5%9D%9040%E5%88%86%E9%92%9F%E5%8A%A81%E6%AC%A1/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E6%AF%8F%E5%9D%9040%E5%88%86%E9%92%9F%E5%8A%A81%E6%AC%A1/cover_3x4.png"], "text": "每坐40分钟动1次，比补品实在\n\n✦ ✦ ✦\n\n💛 打工人懂的都懂：一坐就是大半天，下班腰像断了一样，小腿还肿。我之前也以为得办健身卡才救得了，后来发现，工位上零成本的小动作，比补品实在多了。\n\n✦ ✦ ✦\n\n🌿 【勾脚踮脚泵血液】每坐40分钟，脚后跟抬离地面做踮脚，再勾脚尖绷直，各20次，早晚各一轮。我坚持一周，下午脚踝不胀了，去洗手间发现小腿没那么粗。\n\n✦ ✦ ✦\n\n✨ 【转肩扩胸松后背】双手叉腰，肩膀由前向上向后画大圈，每方向15圈，配合深呼吸。我下午三点必做，原来僵硬的肩胛骨咔地松开了，敲键盘都没那么酸。\n\n✦ ✦ ✦\n\n📌 【靠墙站3分钟正体态】饭后靠墙站，后脑、肩、臀、脚跟贴墙，收腹3分钟。我每天午后做一次，两周下来圆肩轻了，同事说我站姿都挺拔了。\n\n✦ ✦ ✦\n\n💪 别等周末才运动，把动拆进每个40分钟，身体会悄悄谢谢你。你工位上最常用的自救动作是哪个？评论区交出来，互相抄。\n\n✦ ✦ ✦\n\n🏷️ #打工人养生 #久坐自救 #工位拉伸 #肩颈放松 #办公室运动 #碎片化养生 #腰背舒缓 #八小时坐姿 #健康上班 #微运动\n\n✦ ✦ ✦\n\n💡 本文为办公室养生与久坐自救分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有严重身体不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-28_焦虑只是信号", "account": "小白在睡觉", "title": "别再消灭焦虑！它只是个信号", "category": "", "date": "2026-08-28", "status": "待发布", "recommended_time": "今晚21:00", "best_window": "21:00（睡前情绪共鸣时段）", "recommendedTime": "21:00", "compliance": "—", "publish_time": "", "createdAt": "2026-08-28T09:43:21+0800", "publishedAt": null, "summary": "别再消灭焦虑！它只是个信号 ✦ ✦ ✦ 💛 我也曾整夜和焦虑较劲，越想\"别慌\"心跳越响，凌晨两点还睁", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E7%84%A6%E8%99%91%E5%8F%AA%E6%98%AF%E4%BF%A1%E5%8F%B7/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E7%84%A6%E8%99%91%E5%8F%AA%E6%98%AF%E4%BF%A1%E5%8F%B7/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E7%84%A6%E8%99%91%E5%8F%AA%E6%98%AF%E4%BF%A1%E5%8F%B7/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E7%84%A6%E8%99%91%E5%8F%AA%E6%98%AF%E4%BF%A1%E5%8F%B7/cover_3x4.png"], "text": "别再消灭焦虑！它只是个信号\n\n✦ ✦ ✦\n\n💛 我也曾整夜和焦虑较劲，越想\"别慌\"心跳越响，凌晨两点还睁着眼。后来才懂，焦虑不是敌人，是身体在举灯提醒我：今天过载了。承认它，反而先松了半口气。\n\n✦ ✦ ✦\n\n🌿 【给焦虑起个名】今晚如果又慌，别急着压下去，在手机备忘录写三行：我在怕什么、最坏会怎样、我能做的最小一步。我试了两周，写完脑子像卸了半袋米，平均少用20分钟才睡着。\n\n✦ ✦ ✦\n\n✨ 【睡前把念头关进抽屉】躺下前花5分钟，把明天最担心的三件事写在纸上，合上本子告诉自己\"已存档，明早再开\"。这个动作让我从脑子放电影变成安心交班，入睡时间从1小时缩到25分钟。\n\n✦ ✦ ✦\n\n📌 【和身体做朋友】焦虑上来别硬扛，做4组腹式呼吸：吸气4秒、屏息2秒、呼气6秒，手放腹部感受起伏。我每天下午加练3分钟，两周后肩颈没那么僵，晚上也更稳。\n\n✦ ✦ ✦\n\n💪 焦虑不是要被消灭的bug，而是提醒你慢下来的信号灯。你最近一次和身体和解是什么时候？评论区聊聊，咱们互相松绑。\n\n✦ ✦ ✦\n\n🏷️ #焦虑自救 #失眠救星 #情绪稳定 #睡前仪式 #好好睡觉 #心理健康 #打工人解压 #睡眠改善 #放松方法\n\n✦ ✦ ✦\n\n💡 本文为睡眠成分科普与生活分享，内容仅供参考，不替代专业医疗诊断与治疗。如有长期失眠或身体不适，请前往正规医疗机构咨询专业医生。\n"}, {"id": "2026-08-28_白露润燥汤", "account": "白哥的顺时食堂", "title": "白露必喝这碗汤，秋燥全跑光", "category": "", "date": "2026-08-28", "status": "待发布", "recommended_time": "中午12:30", "best_window": "12:30（午休养生时段）", "recommendedTime": "12:30", "compliance": "—", "publish_time": "", "createdAt": "2026-08-28T09:43:21+0800", "publishedAt": null, "summary": "白露必喝这碗汤，秋燥全跑光 ✦ ✦ ✦ 💛 处暑刚过，最近是不是嗓子干、皮肤起皮、早上起来鼻子里都是", "images": ["https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E7%99%BD%E9%9C%B2%E6%B6%A6%E7%87%A5%E6%B1%A4/body_1.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E7%99%BD%E9%9C%B2%E6%B6%A6%E7%87%A5%E6%B1%A4/body_2.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E7%99%BD%E9%9C%B2%E6%B6%A6%E7%87%A5%E6%B1%A4/body_3.png", "https://cdn.jsdelivr.net/gh/bzl2134/bzl@main/%E5%BE%85%E5%8F%91%E5%B8%83/2026-08-28_%E7%99%BD%E9%9C%B2%E6%B6%A6%E7%87%A5%E6%B1%A4/cover_3x4.png"], "text": "白露必喝这碗汤，秋燥全跑光\n\n✦ ✦ ✦\n\n💛 处暑刚过，最近是不是嗓子干、皮肤起皮、早上起来鼻子里都是干的？老祖宗说秋气通于肺，这时候最该润。我每周煮两三次这碗汤，全家人嗓子都舒服了。\n\n✦ ✦ ✦\n\n🌿 【银耳雪梨百合羹】银耳半朵泡发撕小朵，雪梨一个带皮切块，干百合15克，加清水大火煮开转小火炖40分钟，出锅前放几颗冰糖。我连喝5天，早上起床嗓子不干了，皮肤也没那么紧绷。\n\n✦ ✦ ✦\n\n✨ 【老鸭加百合同炖】鸭肉性凉润燥，半只老鸭焯水，配鲜百合30克、沙参10克，慢炖1.5小时。这碗偏补，适合秋燥重、容易干咳的人，我爸连喝三天说喉咙终于不痒了。\n\n✦ ✦ ✦\n\n📌 【少吃辛辣多白色】秋燥天把火锅辣椒先收一收，多吃银耳、梨、山药、白萝卜这些白色食物。我去年秋天还猛吃辣，结果嘴角起皮半个月；今年换清淡，溃疡都没冒。\n\n✦ ✦ ✦\n\n💪 白露前后这碗汤，比任何护肤品都实在。你家乡秋天最爱喝什么润燥？评论区告诉我，我去抄作业。\n\n✦ ✦ ✦\n\n🏷️ #白露养生 #秋燥润燥 #银耳羹 #顺时食养 #润肺汤 #处暑后调理 #养生日常 #食养方 #白色食物\n\n✦ ✦ ✦\n\n💡 本文为顺时养生与食疗食养分享，内容仅供参考，不替代专业医疗诊断与治疗。如您有特殊体质或疾病，请前往正规医疗机构咨询专业医生。\n"}];

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
// 去掉 frontmatter，返回可发布的完整文案（标题+正文+标签+免责声明）
function stripFront(t){t=t||'';if(t.trim().indexOf('---')===0){var p=t.split('---',3);if(p.length>=3)t=p[2];}var i=t.indexOf('配图说明');if(i!==-1)t=t.slice(0,i);return t.trim();}
function copy(t){navigator.clipboard.writeText(t).then(function(){toast('✅ 已复制！');},function(){fallbackCopy(t);});}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('✅ 已复制！');}catch(e){toast('复制失败，请手动选择');}document.body.removeChild(ta);}
function toManifest(){return {items: items.map(function(e){return {id:e.id,account:e.account,title:e.title,summary:e.summary,images:e.images,recommendedTime:e.recommendedTime,status:e._status||e.status,createdAt:e.createdAt,publishedAt:e.publishedAt||null};});};}
async function writeManifest(){if(!manifestHandle)return false;try{const w=await manifestHandle.createWritable();await w.write(JSON.stringify(toManifest(),null,2));await w.close();return true;}catch(e){return false;}}
async function associate(){try{if(!window.showOpenFilePicker){toast('当前环境不支持直接写盘，请用「标记 X 已发布」指令');return;}const hs=await window.showOpenFilePicker({multiple:false,suggestedName:'manifest.json'});manifestHandle=hs[0];toast('✅ 已关联 manifest.json');}catch(e){toast('关联已取消或失败');}}
async function mark(id){
  const it=items.find(function(x){return x.id===id;});
  if(!it)return;
  it._status='已发布';it.publishedAt=new Date().toISOString();
  state[id]='已发布';save();
  const ok=await writeManifest();
  if(ok){toast('✅ 已标记已发布，manifest.json 已更新');}
  else{ // 复制 agent 指令兜底
    const cmd='标记 '+it.title+' 已发布';
    if(navigator.clipboard){navigator.clipboard.writeText(cmd).then(function(){toast('已复制指令：'+cmd+'（发给我即可同步到 manifest）');},function(){toast('请发送：'+cmd);});}
    else{toast('请发送：'+cmd);}
  }
  render();
}
document.getElementById('assocBtn').addEventListener('click',associate);
function render(){
  const app=document.getElementById('app');
  const groups={};
  items.forEach(function(e){e._status=state[e.id]||e.status;groups[e.account]=groups[e.account]||[];groups[e.account].push(e);});
  let html='';
  Object.keys(groups).forEach(function(acc){
    html+='<div class="acc-block"><div class="acc-title">'+acc+'</div><div class="cards">';
    groups[acc].forEach(function(e){
      const pub=(e._status==='已发布');
      const imgs=e.images.map(function(u){return '<img src="'+u+'" loading="lazy" onclick="window.open(''+u+'')">';}).join('');
      const full=stripFront(e.text);
      html+='<div class="card '+(pub?'pub':'')+'">'+
        '<span class="badge '+(pub?'pub':'draft')+'">'+(pub?'✅ 已发布':'⏳ 待发布')+'</span>'+
        '<h3>'+e.title+'</h3>'+
        '<div class="meta">分类：'+(e.category||'—')+'<br>推荐发布：<b>'+(e.recommendedTime||e.recommended_time)+'</b><br>生成时间：'+e.createdAt+(pub?('<br>发布时间：'+e.publishedAt):'')+'</div>'+
        '<div class="imgs">'+imgs+'</div>'+
        '<details><summary>📄 查看文案（点击展开）</summary><pre style="white-space:pre-wrap;font-size:12px;line-height:1.6;">'+full.replace(/</g,'&lt;')+'</pre></details>'+
        '<button class="copy-btn" onclick="copy(`'+full.replace(/`/g,'\`')+'`)">📋 复制文案</button>'+
        (pub?'':'<button class="pub-btn" onclick="mark(`'+e.id+'`)">✅ 标记已发布</button>')+
        '</div>';
    });
    html+='</div></div>';
  });
  app.innerHTML=html;
}
render();
</script>
</body></html>
